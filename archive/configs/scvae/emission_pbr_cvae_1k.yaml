# Conditional emission VAE finetuned from the pretrained PBR VAE on the 1k subset.
# Encoder ingests emission only; decoder is conditioned on the pre-encoded PBR
# latent via channel-concat at decoder input. Shape is implicit in the shared
# sparse voxel coords (no explicit shape latent).
#
# Pretrained surgery (see trellis2/utils/model_surgery.py):
#   encoder.input_layer 6->3 (cols 0:3 of pretrained)
#   decoder.from_latent 32->64 (cols 0:32 of pretrained, 32:64 zero)
#   decoder.output_layer 6->3 (rows 0:3 of pretrained)
# Interior blocks load unchanged.
#
# Two-stage schedule: stage_a_steps=1000 freezes interior; stage B unfreezes
# with layer-wise LR (surgical @ 1e-4, interior @ 3e-5).
#
# Sibling configs:
#   * emission_pbr_vae_finetune_1k.yaml -> channel-hijack 1k baseline (apples-to-apples target)
#   * emission_pbr_cvae_10sample.yaml   -> 10-sample overfit sibling
#
# Run:
#   python train.py --config configs/scvae/emission_pbr_cvae_1k.yaml \
#       --output_dir outputs/emission_pbr_cvae_1k

models:
  encoder:
    name: SparseUnetVaeEncoder
    args:
      in_channels: 3                           # emission only (surgical: 6->3)
      model_channels:
      - 64
      - 128
      - 256
      - 512
      - 1024
      latent_channels: 32
      num_blocks:
      - 0
      - 4
      - 8
      - 16
      - 4
      block_type:
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      down_block_type:
      - SparseResBlockS2C3d
      - SparseResBlockS2C3d
      - SparseResBlockS2C3d
      - SparseResBlockS2C3d
      block_args:
      - use_checkpoint: true
      - use_checkpoint: true
      - use_checkpoint: true
      - use_checkpoint: true
      - use_checkpoint: true
      use_fp16: false
  decoder:
    name: SparseUnetVaeDecoder
    args:
      out_channels: 3                          # emission only (surgical: 6->3)
      model_channels:
      - 1024
      - 512
      - 256
      - 128
      - 64
      latent_channels: 64                      # 32 emission + 32 PBR (surgical: 32->64)
      num_blocks:
      - 4
      - 16
      - 8
      - 4
      - 0
      block_type:
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      up_block_type:
      - SparseResBlockC2S3d
      - SparseResBlockC2S3d
      - SparseResBlockC2S3d
      - SparseResBlockC2S3d
      block_args:
      - use_checkpoint: true
      - use_checkpoint: true
      - use_checkpoint: true
      - use_checkpoint: true
      - use_checkpoint: true
      use_fp16: false
      pred_subdiv: false

dataset:
  name: LightGenSLatEmission
  args:
    data_root: data/lightgen_1k
    parquet_file: data/lightgen_1k/df_SomgProc_emission_filtered.parquet
    resolution: 256
    # Real emission-filtered split: ~878 train + held-out val. Not oversampled —
    # 4 GPUs * BS=8 = 32 global batch * 27 train batches/epoch (drop_last drops at
    # most 31 samples / 1.6% of the split).
    split: train
    split_json: data/lightgen_1k/data_splits_emission_filtered.json
    pbr_attrs: []                              # skip PBR voxel load — using pre-encoded latent
    pbr_latent_name: tex_enc_next_dc_f16c32_fp16_256

trainer:
  name: EmissionPbrConditionalVaeTrainer
  args:
    # 1k has ~100x more unique samples than 10sample; mirror the channel-hijack 1k
    # baseline's max_steps for apples-to-apples comparison.
    max_steps: 40000
    batch_size_per_gpu: 8
    batch_split: 1
    optimizer:
      name: AdamW
      args:
        lr: 0.0001
        weight_decay: 0.0
    ema_rate:
    - 0.9999
    fp16_mode: inflat_all
    fp16_scale_growth: 0.001
    grad_clip:
      name: AdaptiveGradClipper
      args:
        max_norm: 1.0
        clip_percentile: 95
    loss_type: l1
    lambda_kl: 1.0e-07
    emission_channels: 3
    stage_a_steps: 1000
    lr_interior_stage_b: 3.0e-05
    # Stage A freezes encoder.blocks/decoder.blocks (~99% of params), so DDP
    # would otherwise complain about unused params on every step. Required
    # until stage B opens; harmless afterwards.
    ddp_find_unused_parameters: true
    finetune_ckpt:
      encoder: microsoft/TRELLIS.2-4B/ckpts/tex_enc_next_dc_f16c32_fp16
      decoder: microsoft/TRELLIS.2-4B/ckpts/tex_dec_next_dc_f16c32_fp16
    # i_log=1 matches the 10sample sibling and channel-hijack 1k for apples-to-
    # apples wandb dashboards; bump if dashboard load becomes an issue.
    i_log: 1
    i_sample: 2000
    save_top_k: 3
    monitor_metric: val/loss
    monitor_mode: min
    dataloader_num_workers: 16
    use_balanced_sampler: true
    # Validate every 5 epochs (~135 steps) — mirrors channel-hijack 1k.
    val_split_name: val
    val_batch_size_per_gpu: 8
    val_every_epochs: 5
    num_sanity_val_steps: 0
    wandb_enable: true
    wandb_project: emission-pbr-cvae
    wandb_name: emission_pbr_cvae_1k

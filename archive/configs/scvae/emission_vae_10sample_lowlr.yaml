# Emission VAE overfit on 10 samples — lower LR with warmup + cosine decay
#
# Changes vs emission_vae_10sample_overfit.yaml:
#   - lr: 1e-3 → 3e-4
#   - lr_scheduler: LinearWarmup (500 steps) then CosineAnnealingLR to 1e-6 over 30k steps
#
# Run:
#   conda run -n trellis2 python train.py \
#       --config configs/scvae/emission_vae_10sample_lowlr.yaml \
#       --output_dir outputs/emission_vae_10sample_lowlr --ckpt none

models:
  encoder:
    name: SparseUnetVaeEncoder
    args:
      in_channels: 3
      model_channels:
      - 32
      - 64
      - 128
      - 256
      - 512
      latent_channels: 32
      num_blocks:
      - 0
      - 2
      - 4
      - 8
      - 2
      block_type:
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      down_block_type:
      - SparseResBlockS2C3d
      - SparseResBlockS2C3d
      - SparseResBlockS2C3d
      - SparseResBlockS2C3d
      block_args:
      - use_checkpoint: false
      - use_checkpoint: false
      - use_checkpoint: false
      - use_checkpoint: false
      - use_checkpoint: false
      use_fp16: false
  decoder:
    name: SparseUnetVaeDecoder
    args:
      out_channels: 3
      model_channels:
      - 512
      - 256
      - 128
      - 64
      - 32
      latent_channels: 64              # 32 emission + 32 PBR (Option B)
      num_blocks:
      - 2
      - 8
      - 4
      - 2
      - 0
      block_type:
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      up_block_type:
      - SparseResBlockC2S3d
      - SparseResBlockC2S3d
      - SparseResBlockC2S3d
      - SparseResBlockC2S3d
      block_args:
      - use_checkpoint: false
      - use_checkpoint: false
      - use_checkpoint: false
      - use_checkpoint: false
      - use_checkpoint: false
      use_fp16: false
      pred_subdiv: false

dataset:
  name: LightGenSLatEmission
  args:
    data_root: data/lightgen_test
    parquet_file: data/lightgen_test/df_10samples.parquet
    resolution: 256
    split: null
    split_indices: null
    pbr_attrs:
    - base_color
    - metallic
    - roughness
    - alpha

trainer:
  name: EmissionVaeTrainer
  args:
    max_steps: 10000
    batch_size_per_gpu: 4
    batch_split: 1
    optimizer:
      name: AdamW
      args:
        lr: 3.0e-04
        weight_decay: 0.0
    lr_scheduler:
      name: CosineAnnealingLR
      args:
        T_max: 10000
        eta_min: 1.0e-06
    loss_type: l1
    lambda_kl: 1.0e-07
    emission_channels: 3
    pretrained_pbr_encoder: microsoft/TRELLIS.2-4B/ckpts/tex_enc_next_dc_f16c32_fp16
    i_log: 50
    i_sample: 2000
    i_save: 2000
    dataloader_num_workers: 0
    fp16_mode: null
    use_balanced_sampler: false
    num_sanity_val_steps: 0
    limit_val_batches: 0
    wandb_enable: true
    wandb_project: emission-vae-overfit
    wandb_name: 10sample-30k-lowlr-cosine

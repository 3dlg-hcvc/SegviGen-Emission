# Overfit config: emission VAE on a single sample
# Purpose: end-to-end training pipeline sanity check
# Run with:
#   conda run -n trellis2 python train.py \
#       --config configs/scvae/emission_vae_overfit.yaml \
#       --output_dir /tmp/emission_vae_overfit \
#       --ckpt none

models:
  encoder:
    name: SparseUnetVaeEncoder
    args:
      in_channels: 3         # emission RGB only (no conditioning for overfit test)
      model_channels:
      - 32
      - 64
      - 128
      latent_channels: 8
      num_blocks:
      - 0
      - 2
      - 4
      block_type:
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      down_block_type:
      - SparseResBlockS2C3d
      - SparseResBlockS2C3d
      block_args:
      - use_checkpoint: false
      - use_checkpoint: false
      - use_checkpoint: false
      use_fp16: false
  decoder:
    name: SparseUnetVaeDecoder
    args:
      out_channels: 3
      model_channels:
      - 128
      - 64
      - 32
      latent_channels: 8
      num_blocks:
      - 4
      - 2
      - 0
      block_type:
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      up_block_type:
      - SparseResBlockC2S3d
      - SparseResBlockC2S3d
      block_args:
      - use_checkpoint: false
      - use_checkpoint: false
      - use_checkpoint: false
      use_fp16: false
      pred_subdiv: false

dataset:
  name: LightGenSLatEmission
  args:
    data_root: data/lightgen_test
    parquet_file: /localhome/dya78/code/lightgen/data/baked_uv_local_subset/df_SomgProc_emission_filtered.parquet
    resolution: 256
    split: null            # disable split filtering — use split_indices below
    split_indices:
    - 0                    # only sample index 0 (UUID 0007deb6...)
    pbr_attrs: []          # no PBR conditioning — emission-only (3-channel) baseline

trainer:
  name: EmissionVaeTrainer
  args:
    max_steps: 500
    batch_size_per_gpu: 1
    batch_split: 1
    optimizer:
      name: AdamW
      args:
        lr: 0.001          # high LR to overfit quickly
        weight_decay: 0.0
    loss_type: l1
    lambda_kl: 1.0e-07     # very small KL to avoid posterior collapse during overfit
    emission_channels: 3
    i_log: 10              # log every 10 steps
    i_sample: 100          # snapshot every 100 steps
    i_save: 500
    dataloader_num_workers: 0
    fp16_mode: null
    use_balanced_sampler: false
    num_sanity_val_steps: 0   # no validation — single-sample overfit test
    limit_val_batches: 0

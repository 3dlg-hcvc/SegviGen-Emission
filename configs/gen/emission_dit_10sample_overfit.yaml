# Emission DiT overfit on 10 samples — full parity architecture
#
# Uses ElasticSLatFlowModel + shape+PBR concat + DINOv3 + CFG trainer
# Normalization stats computed from 10 samples
#
# Run:
#   conda run -n trellis2 python train.py \
#       --config configs/gen/emission_dit_10sample_overfit.yaml \
#       --output_dir /tmp/emission_dit_10sample_overfit --ckpt none

models:
  denoiser:
    name: ElasticSLatFlowModel
    args:
      resolution: 16
      in_channels: 96
      out_channels: 32
      model_channels: 256
      cond_channels: 1024
      num_blocks: 4
      num_heads: 4
      mlp_ratio: 4
      pe_mode: rope
      share_mod: true
      initialization: scaled
      qk_rms_norm: true
      qk_rms_norm_cross: true

dataset:
  name: LightGenSLatEmissionLatent
  args:
    data_root: /tmp/lightgen_test
    parquet_file: /tmp/lightgen_test/df_10samples.parquet
    emission_latent_name: emission_vae_optB_overfit
    pbr_latent_name: tex_enc_next_dc_f16c32_fp16_256
    shape_latent_name: shape_enc_next_dc_f16c32_fp16_256
    thumbnail_dir: /tmp/lightgen_test/thumbnails
    image_size: 512
    resolution: 256
    split: null
    emission_normalization:
      mean: [0.537512, -0.871122, 0.43228, -1.389229, -0.722787, 0.193243, 1.09244, 0.95527, 1.278743, 0.054935, -1.065166, 0.777629, -0.168178, 0.980232, 0.889498, -1.516895, -0.453832, -0.61696, -0.327658, 1.009401, -0.14934, -0.208345, 0.860343, 0.169175, -0.257071, -1.258874, 0.233699, 0.001252, -0.099048, 1.752042, 0.083885, 0.15115]

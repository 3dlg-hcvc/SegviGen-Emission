# Emission DiT overfit on 10 samples — fine-tuned from pretrained PBR DiT
#
# Architecture: ElasticSLatFlowModel (1.3B) initialized from PBR DiT
# in_channels=96 (32 emission + 32 shape + 32 PBR), out=32
# Input layer re-initialized (shape mismatch), all transformer blocks loaded
#
# Run:
#   conda run -n trellis2 python train.py \
#       --config configs/gen/emission_dit_10sample_overfit.yaml \
#       --output_dir outputs/emission_dit_10sample_overfit --ckpt none

models:
  denoiser:
    name: ElasticSLatFlowModel
    args:
      resolution: 32
      in_channels: 96
      out_channels: 32
      model_channels: 1536
      cond_channels: 1024
      num_blocks: 30
      num_heads: 12
      mlp_ratio: 5.3334
      pe_mode: rope
      share_mod: true
      initialization: scaled
      qk_rms_norm: true
      qk_rms_norm_cross: true

dataset:
  name: LightGenSLatEmissionLatent
  args:
    data_root: data/lightgen_test
    parquet_file: data/lightgen_test/df_10samples.parquet
    emission_latent_name: emission_vae_10sample_overfit
    pbr_latent_name: tex_enc_next_dc_f16c32_fp16_256
    shape_latent_name: shape_enc_next_dc_f16c32_fp16_256
    thumbnail_dir: data/lightgen_test/thumbnails
    image_size: 512
    resolution: 256
    split: null
    emission_normalization:
      mean: [0.020462, -0.079480, 0.015277, 0.001580, 0.084057, -0.096408, -0.136363, 0.073868, -0.043608, -0.214690, 0.235098, 0.248996, -0.068667, 0.024285, -0.043843, -0.030129, -0.031701, -0.099118, -0.198534, -0.175414, 0.030452, 0.033616, 0.020528, -0.103855, -0.100931, 0.023672, -0.019523, 0.025846, -0.095900, 0.031444, -0.192871, -0.048441]

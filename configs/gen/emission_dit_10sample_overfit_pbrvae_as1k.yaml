    val_split_name: train

trainer:
  name: ImageConditionedSparseFlowMatchingCFGTrainer
  args:
    max_steps: 6000
    batch_size_per_gpu: 8
    batch_split: 1
    optimizer:
      name: AdamW
      args:
        lr: 0.0001
        weight_decay: 0.01
        betas: [0.9, 0.95]
        eps: 1.0e-08
    t_schedule:
      name: uniform
      args: {}
    sigma_min: 1.0e-05
    p_uncond: 0.1
    mix_precision_mode: amp
    mix_precision_dtype: bfloat16
    elastic:
      name: LinearMemoryController
      args:
        target_ratio: 0.75
        max_mem_ratio_start: 0.5
    grad_clip:
      name: AdaptiveGradClipper
      args:
        max_norm: 1.0
        clip_percentile: 95
    finetune_ckpt:
      denoiser: microsoft/TRELLIS.2-4B/ckpts/slat_flow_imgshape2tex_dit_1_3B_512_bf16
    i_log: 1
    i_sample: 1000
    val_num_samples: 4
    skip_initial_samples: true
    dataloader_num_workers: 0
    use_balanced_sampler: false
    num_sanity_val_steps: 0
    val_split_name: train
    val_every_epochs: 5
    val_batch_size_per_gpu: 4
    save_top_k: 3
    monitor_metric: val/loss
    monitor_mode: min
    wandb_enable: true
    wandb_project: emission-dit
    wandb_name: emission_dit_10s_overfit_as1k
    image_cond_model:
      name: DinoV3FeatureExtractor
      args:
        model_name: facebook/dinov3-vitl16-pretrain-lvd1689m
        image_size: 512

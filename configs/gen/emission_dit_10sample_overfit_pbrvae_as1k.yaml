      std: [2.943756, 2.948857, 2.924237, 2.867811, 2.91679, 2.228959, 2.505883, 2.77452, 2.733974, 2.760734, 2.318266, 3.20612, 3.06421, 2.503504, 2.861791, 3.424922, 2.357528, 2.888028, 3.425426, 2.579271, 3.29478, 2.91707, 4.058385, 2.600306, 2.841796, 2.564054, 2.465189, 2.301706, 3.253912, 2.539903, 2.792622, 2.538011]
    shape_normalization:

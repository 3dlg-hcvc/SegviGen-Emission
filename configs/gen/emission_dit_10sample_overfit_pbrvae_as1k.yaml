# Emission DiT overfit on 10 samples — DDP-safe oversampled split + top-k val + wandb.
#
# Sibling of emission_dit_10sample_overfit_pbrvae.yaml (original kept for reference).
# Changes:
#   - repo-relative data paths (works on every host; matches VAE "as1k" configs)
#   - split: train + split_json: data_splits_10sample_as1k.json  (TRAIN_SIZE=640,
#     divisible by 4*8, drop_last drops 0)
#   - batch_size_per_gpu: 8   (fits L40S comfortably alongside DINOv3 cond)
#   - val_split_name: train   (overfit memorization check — val == train)
#   - save_top_k: 3           (top-k by val/loss; requires val loop)
#   - wandb_enable: true
#   - max_steps: 6000         (user target)
#   - i_log: 1                (small dataset flush gotcha)

models:
  denoiser:
    name: ElasticSLatFlowModel
    args:
      resolution: 32
      in_channels: 96
      out_channels: 32
      model_channels: 1536
      cond_channels: 1024
      num_blocks: 30
      num_heads: 12
      mlp_ratio: 5.3334
      pe_mode: rope
      share_mod: true
      initialization: scaled
      qk_rms_norm: true
      qk_rms_norm_cross: true

dataset:
  name: LightGenSLatEmissionLatent
  args:
    data_root: data/lightgen_test
    parquet_file: data/lightgen_test/df_10samples.parquet
    emission_latent_name: emission_pbr_finetune_10sample
    pbr_latent_name: tex_enc_next_dc_f16c32_fp16_256
    shape_latent_name: shape_enc_next_dc_f16c32_fp16_256
    thumbnail_dir: data/lightgen_test/thumbnails
    image_size: 512
    resolution: 256
    split: train
    split_json: data/lightgen_test/data_splits_10sample_as1k.json
    emission_normalization:
      mean: [0.047930, 3.592776, -0.736781, -2.614156, 4.220987, -0.508459, -0.007023, 1.846091, -0.967105, 1.685355, 0.677347, -2.375463, 0.546260, -1.542620, -4.312495, -1.951082, -1.744630, 4.870405, 3.237855, 1.626749, 1.432003, -0.582766, -1.723233, -3.701661, -0.461003, -0.025246, 1.413326, -0.892174, 3.707623, -0.427026, -0.479717, -3.131104]
      std: [4.830730, 3.571913, 4.110367, 4.295566, 4.975303, 3.112283, 4.109525, 4.626173, 3.384117, 4.213969, 3.638840, 3.666451, 3.163438, 3.576496, 4.336730, 3.526103, 3.255047, 4.415345, 3.841889, 3.445452, 3.891995, 3.846739, 3.194658, 3.893530, 4.399847, 4.758321, 4.261539, 3.333122, 4.117391, 4.412472, 2.766402, 4.065998]

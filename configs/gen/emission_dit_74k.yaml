# Emission DiT — 74k channel-hijack (retarget imgshape2tex texture DiT to emission).
#
# Spec:  docs/superpowers/specs/2026-06-15-emission-dit-74k-design.md
# Plan:  docs/superpowers/plans/2026-06-15-emission-dit-74k.md
#
# Architecture byte-identical to slat_flow_imgshape2tex_dit_1_3B_512_bf16:
#   in=64 (32 noised emission + 32 shape), out=32, image via DinoV3 cross-attn.
#   skip_pbr_cond=true -> no PBR stream. Full weight reuse incl. input proj.
#
# PENDING (Task 2 / Phase 1 on fir): emission_normalization mean/std below are a
# placeholder — replace with the arrays printed by
#   data_toolkit/encode_emission_pbrfinetune_dataset.py --aggregate_stats
# (written to emission_latents/emission_pbr_vae_ft_74k/normalization_stats.json).
# Also confirm in Phase 0: thumbnail dir name + final VAE ckpt.

models:
  denoiser:
    name: ElasticSLatFlowModel
    args:
      resolution: 32
      in_channels: 64
      out_channels: 32
      model_channels: 1536
      cond_channels: 1024
      num_blocks: 30
      num_heads: 12
      mlp_ratio: 5.3334
      pe_mode: rope
      share_mod: true
      initialization: scaled
      qk_rms_norm: true
      qk_rms_norm_cross: true

dataset:
  name: LightGenSLatEmissionLatent
  args:
    data_root: data/lightgen_74k
    parquet_file: data/lightgen_74k/df_SomgProc_final.parquet
    emission_latent_name: emission_pbr_vae_ft_74k
    pbr_latent_name: tex_enc_next_dc_f16c32_fp16_256   # required kwarg; unused when skip_pbr_cond=true
    shape_latent_name: shape_enc_next_dc_f16c32_fp16_256
    thumbnail_dir: data/lightgen_74k/thumbnails
    image_size: 512
    resolution: 256
    split: train
    split_json: data/lightgen_74k/data_splits_emissive_74k_stratified_voxonly.json
    skip_pbr_cond: true
    emission_normalization:
      # Computed over the 72,549 emission latents encoded by emission_pbr_vae_ft_74k
      # step0016816-0.0095.ckpt (the fir best-val VAE, better than the step4485 used
      # on vulcan) on fir, 36M tokens. normalization_stats.json at
      # .../lightgen_74k/emission_latents/emission_pbr_vae_ft_74k/.
      mean: [-0.933585, 4.152558, -2.377601, -2.273196, 5.057539, -0.489705, -0.073768, 3.512470, -1.794249, 2.732491, 0.866541, -3.510263, 0.939064, -2.189065, -6.603068, -0.933373, -2.646374, 6.744867, 3.001588, 1.330736, 2.765167, -1.726918, -3.423802, -4.937253, -0.551379, 0.183507, 2.175160, -0.621138, 5.458714, -0.123712, -1.424994, -3.235051]
      std: [4.847950, 3.770887, 4.488286, 3.704051, 5.249761, 3.263523, 4.075392, 4.792339, 3.707109, 4.521730, 3.590725, 4.916586, 3.322254, 3.698352, 4.937610, 3.736450, 3.177211, 4.484698, 3.551457, 3.454334, 3.543492, 4.004798, 3.582789, 4.191025, 4.065111, 4.972800, 4.425003, 3.298694, 3.850369, 4.945311, 2.543228, 4.079315]
    shape_normalization:
      # Production shape stats copied verbatim from the base DiT config
      # slat_flow_imgshape2tex_dit_1_3B_512_bf16.yaml (shape_slat_normalization).
      # The shape latents ARE the production shape_enc_next_dc_f16c32_fp16_256,
      # so these are the correct stats (NOT the 10-sample stats the 1k probe carried).
      mean: [0.781296, 0.018091, -0.495192, -0.558457, 1.06053, 0.093252, 1.518149, -0.933218, -0.732996, 2.604095, -0.118341, -2.143904, 0.495076, -2.179512, -2.130751, -0.996944, 0.261421, -2.217463, 1.260067, -0.150213, 3.790713, 1.481266, -1.046058, -1.523667, -0.059621, 2.22078, 1.621212, 0.87723, 0.567247, -3.175944, -3.186688, 1.578665]
      std: [5.972266, 4.706852, 5.44501, 5.209927, 5.32022, 4.547237, 5.020802, 5.444004, 5.226681, 5.683095, 4.831436, 5.286469, 5.652043, 5.367606, 5.525084, 4.730578, 4.805265, 5.124013, 5.530808, 5.619001, 5.10393, 5.41767, 5.269677, 5.547194, 5.634698, 5.235274, 6.110351, 5.511298, 6.237273, 4.879207, 5.347008, 5.405691]

trainer:
  name: ImageConditionedSparseFlowMatchingCFGTrainer
  args:
    max_steps: 50000
    batch_size_per_gpu: 8     # probe may bump to 16
    # batch_split MUST be 1 with the elastic LinearMemoryController: the
    # ElasticControllerCallback opens one record() window per optimizer step
    # (on_train_batch_start..end), so all forwards in it must share input_size.
    # With batch_split>1 the sub-batch forwards have different sparse token
    # counts -> "Input size should not change for different ElasticModules"
    # crash (elastic_utils.py:25). One 8-sample forward fits H100.
    batch_split: 1
    optimizer:
      name: AdamW
      args:
        lr: 0.0001
        weight_decay: 0.01
        betas: [0.9, 0.95]
        eps: 1.0e-08
    lr_scheduler:
      name: LinearWarmupLRScheduler
      args:
        warmup_steps: 1000
    ema_rate:
    - 0.9999
    t_schedule:
      name: uniform
      args: {}
    sigma_min: 1.0e-05
    p_uncond: 0.1
    mix_precision_mode: amp
    mix_precision_dtype: bfloat16
    elastic:
      name: LinearMemoryController
      args:
        target_ratio: 0.75
        max_mem_ratio_start: 0.5
    grad_clip:
      name: AdaptiveGradClipper
      args:
        max_norm: 1.0
        clip_percentile: 95
    finetune_ckpt:
      denoiser: microsoft/TRELLIS.2-4B/ckpts/slat_flow_imgshape2tex_dit_1_3B_512_bf16
    i_log: 50
    i_sample: 5000
    skip_initial_samples: true
    dataloader_num_workers: 8
    use_balanced_sampler: true
    num_sanity_val_steps: 0
    val_split_name: val
    val_every_epochs: 1        # recalibrate after the probe gives steps/sec
    val_batch_size_per_gpu: 4
    save_top_k: 1
    monitor_metric: val/loss
    monitor_mode: min
    # last.ckpt is 20 GB; on fir Lustre a full write takes ~10-13 min. The
    # dd5f896 default (refresh every 200 steps ~= 2 min) is far shorter than the
    # write, so writes thrash and leave a 0-byte last.ckpt that crash-loops
    # resume. 2000 steps (~20 min at 1.6 it/s) > write time -> each refresh
    # completes cleanly. (Best-val top-k saves are the quality checkpoints.)
    ckpt_last_every_n_steps: 2000
    wandb_enable: true
    wandb_project: emission-dit
    wandb_name: emission_dit_74k
    image_cond_model:
      name: DinoV3FeatureExtractor
      args:
        model_name: facebook/dinov3-vitl16-pretrain-lvd1689m
        image_size: 512

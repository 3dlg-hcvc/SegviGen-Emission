# Emission DiT — 74k albedo-slot latents WITH PBR conditioning (channel concat).
#
# Purpose: unify conditioning across the TRELLIS.2 emission baselines. The
# original albedo2emission chain (emission_dit_albedo2emission_74k_v2.yaml,
# in=64, skip_pbr_cond=true) receives NO PBR condition; this config trains the
# same albedo-slot VAE latents with the PBR latent channel-concatenated per
# token, exactly like the pbr2emission chain:
#   in=96 (32 noised emission + 32 shape + 32 PBR), out=32, DinoV3 cross-attn.
# The pretrained imgshape2tex DiT has a 64-ch input proj, so on finetune the
# input projection is RE-INITIALIZED (shape mismatch); all 30 transformer
# blocks are still loaded — identical warm-start regime to
# emission_dit_pbr2emission_74k_v2.yaml.
#
# Display names: this run inherits "albedo→emission"; the old no-PBR run
# becomes "albedo→emission without pbr condition" (ablation row).
#
# Deltas vs emission_dit_albedo2emission_74k_v2.yaml: in_channels 64->96,
# skip_pbr_cond false, pbr_normalization added (copied verbatim from
# emission_dit_pbr2emission_74k_v2.yaml — same newbake cohort), wandb_name.
# Everything else (data, split, hyperparams, emission/shape stats) unchanged.

models:
  denoiser:
    name: ElasticSLatFlowModel
    args:
      resolution: 32
      in_channels: 96
      out_channels: 32
      model_channels: 1536
      cond_channels: 1024
      num_blocks: 30
      num_heads: 12
      mlp_ratio: 5.3334
      pe_mode: rope
      share_mod: true
      initialization: scaled
      qk_rms_norm: true
      qk_rms_norm_cross: true

dataset:
  name: LightGenSLatEmissionLatent
  args:
    data_root: data/lightgen_74k_newbake
    parquet_file: data/lightgen_74k_newbake/df_SomgProc_final.parquet
    emission_latent_name: emission_albedo2emission_74k_v2
    pbr_latent_name: tex_enc_next_dc_f16c32_fp16_256   # USED here (skip_pbr_cond=false)
    shape_latent_name: shape_enc_next_dc_f16c32_fp16_256
    thumbnail_dir: data/lightgen_74k_newbake/thumbnails
    image_size: 512
    resolution: 256
    split: train
    split_json: data/lightgen_74k_newbake/data_splits_emissive_74k_stratified_newbake_vae.json
    skip_pbr_cond: false
    emission_normalization:
      # Newbake emission_albedo2emission_74k_v2 latent stats over the 72,421
      # cohort (recomputed in commit 2d4805a; arrays copied verbatim from
      # emission_dit_albedo2emission_74k_v2.yaml — same latents, same stats).

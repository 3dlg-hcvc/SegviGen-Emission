# Full-parity emission DiT overfit config
#
# Architecture matches PBR DiT: ElasticSLatFlowModel backbone, shape+PBR concat,
# DINOv3 cross-attention, ImageConditionedSparseFlowMatchingCFGTrainer.
#
# in_channels  = 96  = 32 (noised emission latent) + 32 (shape latent) + 32 (PBR latent)
# out_channels = 32  = predicted velocity for emission latent
# cond_channels = 1024 = DINOv3 image features
#
# Run:
#   conda run -n trellis2 python train.py \
#       --config configs/gen/emission_dit_full_overfit.yaml \
#       --output_dir /tmp/emission_dit_full_overfit --ckpt none

models:
  denoiser:
    name: ElasticSLatFlowModel
    args:
      resolution: 16
      in_channels: 96
      out_channels: 32
      model_channels: 256
      cond_channels: 1024
      num_blocks: 4
      num_heads: 4
      mlp_ratio: 4
      pe_mode: rope
      share_mod: true
      initialization: scaled
      qk_rms_norm: true
      qk_rms_norm_cross: true

dataset:
  name: LightGenSLatEmissionLatent
  args:
    data_root: data/lightgen_test
    parquet_file: /localhome/dya78/code/lightgen/data/baked_uv_local_subset/df_SomgProc_emission_filtered.parquet
    emission_latent_name: emission_vae_optB_overfit
    pbr_latent_name: tex_enc_next_dc_f16c32_fp16_256
    shape_latent_name: shape_enc_next_dc_f16c32_fp16_256
    thumbnail_dir: data/lightgen_test/thumbnails

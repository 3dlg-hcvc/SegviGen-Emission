# Overfit config: emission DiT (flow matching) on a single sample
#
# Architecture:
#   SLatFlowModel — sparse latent flow transformer
#   in_channels:  64  = 32 (noised emission latent) + 32 (PBR material latent concat)
#   out_channels: 32  = predicted velocity for emission latent
#   cond_channels: 32 = dummy cross-attention context (no-op for overfit)
#
# Conditioning:
#   concat_cond: PBR material latent (32ch) — concatenated per token
#   cond:        dummy zeros (32ch, 1 token) — placeholder for future image/shape cross-attn
#
# Data:
#   Pre-encoded emission + PBR latents from encode_single_sample_latents.py
#
# Run:
#   conda run -n trellis2 python train.py \
#       --config configs/gen/emission_dit_overfit.yaml \
#       --output_dir /tmp/emission_dit_overfit --ckpt none

models:
  denoiser:
    name: SLatFlowModel
    args:
      resolution: 16
      in_channels: 64
      out_channels: 32
      model_channels: 256
      cond_channels: 32
      num_blocks: 4
      num_heads: 4
      mlp_ratio: 4
      pe_mode: rope
      share_mod: true
      initialization: scaled
      qk_rms_norm: true
      qk_rms_norm_cross: true

dataset:
  name: LightGenSLatEmissionLatent
  args:
    data_root: data/lightgen_test
    parquet_file: /localhome/dya78/code/lightgen/data/baked_uv_local_subset/df_SomgProc_emission_filtered.parquet
    emission_latent_name: emission_vae_optB_overfit
    pbr_latent_name: tex_enc_next_dc_f16c32_fp16_256
    resolution: 256
    split: null
    split_indices:
    - 0
    dummy_cond_channels: 32

trainer:
  name: SparseFlowMatchingTrainer
  args:
    max_steps: 2000
    batch_size_per_gpu: 1
    batch_split: 1
    optimizer:
      name: AdamW
      args:
        lr: 0.0003
        weight_decay: 0.0
    t_schedule:
      name: uniform
      args: {}
    sigma_min: 1.0e-05
    mix_precision_mode: amp
    mix_precision_dtype: bfloat16
    i_log: 10
    i_sample: 0
    i_save: 2000
    skip_initial_samples: true
    dataloader_num_workers: 0
    use_balanced_sampler: false
    num_sanity_val_steps: 0
    limit_val_batches: 0

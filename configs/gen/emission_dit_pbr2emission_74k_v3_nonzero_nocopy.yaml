      mean: [2.459846, 4.065421, 0.413267, 0.327300, 1.756047, -0.557769, 0.732136, -0.028239, -0.333709, 0.284831, -0.308731, -1.348872, 0.354504, -0.674031, -2.027810, -0.833997, -1.920284, 2.932981, 0.134387, 1.969363, 0.678580, 0.761813, -1.862095, -2.311098, 1.546501, 0.784206, 0.257996, 0.305836, 2.142905, 0.212852, -1.674991, -1.769278]

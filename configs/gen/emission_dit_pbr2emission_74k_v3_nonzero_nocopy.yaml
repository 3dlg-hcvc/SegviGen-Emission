# _nonzero_nocopy (2026-08-20): identical to emission_dit_pbr2emission_74k_v3.yaml
# except (1) emission_latent_name -> the latents encoded by the FILTERED VAE
# (emission_vae_pbr2emission_74k_v3_nonzero_nocopy, best step0035600-0.0055),
# (2) split_json -> _nonzero_nocopy (train 63,194; val/test unchanged),
# (3) emission_normalization -> regenerated stats for those latents (venus-19 job
# 247118 normalization_stats.json; 35,174,674 tokens / 72,421 shapes), and
# (4) wandb_name. pbr/shape normalization unchanged — those latent sets are unchanged.
# Spec: lightgen docs/superpowers/specs/2026-08-19-filtered-baselines-retrain-design.md
#
# Emission DiT — 74k TWO-STREAM (mirror of emission_dit_74k.yaml for the
# two-stream emission VAE instead of the channel-hijack baseline).
#
# Baseline (emission_dit_74k.yaml): channel-hijack VAE latents, in=64
#   (32 emission + 32 shape), skip_pbr_cond=true, full weight reuse incl input proj.
# This config:                      two-stream VAE latents, in=96
#   (32 emission + 32 shape + 32 PBR), skip_pbr_cond=false. The two-stream
#   decoder consumes concat(z_emission, z_pbr), so the DiT MUST condition on the
#   PBR latent — hence 96-ch input. The pretrained imgshape2tex DiT has a 64-ch
#   input proj, so on finetune the input projection is RE-INITIALIZED (shape
#   mismatch); all 30 transformer blocks are still loaded. This 96-ch recipe is
#   the one validated at 10-sample overfit (emission_dit_10sample_overfit.yaml).
#
# Normalization: emission + PBR stats below are the real 74k values from
# script/fir/encode_twostream_dit_latents_74k.sh (fir job 44913544; 36M tokens /
# 72,549 samples each). shape_normalization is the production shape-latent stats.

models:
  denoiser:
    name: ElasticSLatFlowModel
    args:
      resolution: 32
      in_channels: 96
      out_channels: 32
      model_channels: 1536
      cond_channels: 1024
      num_blocks: 30
      num_heads: 12
      mlp_ratio: 5.3334
      pe_mode: rope
      share_mod: true
      initialization: scaled
      qk_rms_norm: true
      qk_rms_norm_cross: true

dataset:
  name: LightGenSLatEmissionLatent
  args:
    data_root: data/lightgen_74k_newbake
    parquet_file: data/lightgen_74k_newbake/df_SomgProc_final.parquet
    emission_latent_name: emission_pbr2emission_74k_v3_nonzero_nocopy
    pbr_latent_name: tex_enc_next_dc_f16c32_fp16_256   # USED here (skip_pbr_cond=false)
    shape_latent_name: shape_enc_next_dc_f16c32_fp16_256
    thumbnail_dir: data/lightgen_74k_newbake/thumbnails
    image_size: 512
    resolution: 256
    split: train
    split_json: data/lightgen_74k_newbake/data_splits_emissive_74k_stratified_newbake_vae_nonzero_nocopy.json
    skip_pbr_cond: false
    emission_normalization:
      # emission_pbr2emission_74k_v3_nonzero_nocopy latents: 35,174,674 tokens /
      # 72,421 shapes, from the encode job's aggregated normalization_stats.json
      # (venus-19 job 247118, encode_emission_twostream_dataset.py --aggregate_stats).
      # These MUST be regenerated with the latents — the v3-baseline arrays belong
      # to a different VAE and would mis-scale every input.
      mean: [-0.311536, 4.668826, -1.508508, -2.205819, 4.863864, -0.714046, -0.038378, 3.502740, -2.200386, 2.545248, 1.053611, -3.580139, 1.097387, -2.363945, -6.725149, -0.730242, -2.998219, 6.799044, 2.385876, 1.781725, 2.697583, -1.980025, -4.035911, -4.971022, -0.277431, 0.243434, 1.911091, -0.478384, 5.658317, 0.218194, -2.313983, -3.434929]
      std: [3.825690, 3.148674, 3.409252, 3.004479, 4.206540, 2.772171, 3.504043, 3.838335, 3.099000, 3.762041, 2.971302, 4.001220, 2.746931, 3.058317, 3.978574, 3.199529, 2.666931, 3.680099, 2.883096, 2.861148, 2.883546, 3.287050, 3.028097, 3.416100, 3.457966, 4.248388, 3.724306, 2.725430, 3.138028, 4.131811, 2.116225, 3.516954]
    pbr_normalization:

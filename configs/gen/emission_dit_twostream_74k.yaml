# Emission DiT — 74k TWO-STREAM (mirror of emission_dit_74k.yaml for the
# two-stream emission VAE instead of the channel-hijack baseline).
#
# Baseline (emission_dit_74k.yaml): channel-hijack VAE latents, in=64
#   (32 emission + 32 shape), skip_pbr_cond=true, full weight reuse incl input proj.
# This config:                      two-stream VAE latents, in=96
#   (32 emission + 32 shape + 32 PBR), skip_pbr_cond=false. The two-stream
#   decoder consumes concat(z_emission, z_pbr), so the DiT MUST condition on the
#   PBR latent — hence 96-ch input. The pretrained imgshape2tex DiT has a 64-ch
#   input proj, so on finetune the input projection is RE-INITIALIZED (shape
#   mismatch); all 30 transformer blocks are still loaded. This 96-ch recipe is
#   the one validated at 10-sample overfit (emission_dit_10sample_overfit.yaml).
#
# Normalization: emission + PBR stats below are the real 74k values from
# script/fir/encode_twostream_dit_latents_74k.sh (fir job 44913544; 36M tokens /
# 72,549 samples each). shape_normalization is the production shape-latent stats.

models:
  denoiser:
    name: ElasticSLatFlowModel
    args:
      resolution: 32
      in_channels: 96
      out_channels: 32
      model_channels: 1536
      cond_channels: 1024
      num_blocks: 30
      num_heads: 12
      mlp_ratio: 5.3334
      pe_mode: rope
      share_mod: true
      initialization: scaled
      qk_rms_norm: true
      qk_rms_norm_cross: true

dataset:
  name: LightGenSLatEmissionLatent
  args:
    data_root: data/lightgen_74k
    parquet_file: data/lightgen_74k/df_SomgProc_final.parquet
    emission_latent_name: emission_vae_twostream_74k
    pbr_latent_name: tex_enc_next_dc_f16c32_fp16_256   # USED here (skip_pbr_cond=false)
    shape_latent_name: shape_enc_next_dc_f16c32_fp16_256
    thumbnail_dir: data/lightgen_74k/thumbnails
    image_size: 512
    resolution: 256
    split: train
    split_json: data/lightgen_74k/data_splits_emissive_74k_stratified_voxonly.json
    skip_pbr_cond: false
    emission_normalization:
      # Two-stream emission_vae_twostream_74k latents (36M tokens / 72,549 samples).
      mean: [-2.429359, -5.260138, 4.922578, 4.205037, -6.231251, 4.583925, 0.699208, 1.828208, 0.547576, 7.753712, -1.188707, 0.678855, -3.529652, 4.154868, -0.788858, -2.803219, -0.601168, 3.793408, -3.256456, 5.759635, -2.771214, 3.330337, 2.187806, -2.638081, -2.810187, 0.595176, -0.414438, -2.480853, 0.819716, -4.724916, 1.519547, -0.486408]
      std: [3.174798, 3.665874, 4.037838, 5.902186, 4.742224, 4.332126, 4.585951, 3.829938, 3.402300, 4.543265, 4.512951, 5.499556, 4.381903, 3.943183, 4.374763, 3.875302, 3.901465, 4.898321, 4.622261, 5.222077, 5.672593, 4.431832, 4.707246, 4.159581, 4.126579, 3.706660, 3.738877, 3.004374, 3.846312, 5.567358, 3.603349, 3.242927]
    pbr_normalization:
      # Production tex_enc_next_dc_f16c32_fp16_256 latents over the same 72,549 samples.
      mean: [3.428170, 3.294830, 1.302273, 0.800814, 0.677756, -0.597211, 0.802017, -0.818352, 0.340080, -0.312021, -0.690820, -0.266351, -0.277867, -0.082624, -0.787140, -0.214899, -1.474704, 2.119771, -0.327685, 2.320879, 0.280001, 1.480567, -1.361856, -1.629177, 1.729373, 0.761835, -0.185218, 0.176544, 1.753292, 0.242445, -1.421205, -1.279988]
      std: [2.797216, 3.040730, 2.931041, 2.799409, 3.148016, 2.298694, 2.451205, 2.988649, 2.952048, 2.797183, 2.417597, 3.386020, 3.138244, 2.618276, 3.278343, 3.141690, 2.578097, 3.226009, 3.365666, 2.511631, 2.916322, 2.940704, 3.389722, 2.695656, 2.877646, 2.476421, 2.704774, 2.369544, 3.045444, 2.568191, 2.937541, 2.816936]
    shape_normalization:
      # Production shape stats copied verbatim from emission_dit_74k.yaml
      # (slat_flow_imgshape2tex_dit_1_3B_512_bf16 shape_slat_normalization). The
      # shape latents ARE the production shape_enc_next_dc_f16c32_fp16_256, so
      # these are correct (NOT a placeholder).
      mean: [0.781296, 0.018091, -0.495192, -0.558457, 1.06053, 0.093252, 1.518149, -0.933218, -0.732996, 2.604095, -0.118341, -2.143904, 0.495076, -2.179512, -2.130751, -0.996944, 0.261421, -2.217463, 1.260067, -0.150213, 3.790713, 1.481266, -1.046058, -1.523667, -0.059621, 2.22078, 1.621212, 0.87723, 0.567247, -3.175944, -3.186688, 1.578665]
      std: [5.972266, 4.706852, 5.44501, 5.209927, 5.32022, 4.547237, 5.020802, 5.444004, 5.226681, 5.683095, 4.831436, 5.286469, 5.652043, 5.367606, 5.525084, 4.730578, 4.805265, 5.124013, 5.530808, 5.619001, 5.10393, 5.41767, 5.269677, 5.547194, 5.634698, 5.235274, 6.110351, 5.511298, 6.237273, 4.879207, 5.347008, 5.405691]

trainer:
  name: ImageConditionedSparseFlowMatchingCFGTrainer
  args:
    max_steps: 50000
    batch_size_per_gpu: 8     # probe may bump to 16
    # batch_split MUST be 1 with the elastic LinearMemoryController (see
    # emission_dit_74k.yaml for the full rationale).
    batch_split: 1
    optimizer:
      name: AdamW
      args:
        lr: 0.0001
        weight_decay: 0.01
        betas: [0.9, 0.95]
        eps: 1.0e-08
    lr_scheduler:
      name: LinearWarmupLRScheduler
      args:
        warmup_steps: 1000
    ema_rate:
    - 0.9999
    t_schedule:
      name: uniform
      args: {}
    sigma_min: 1.0e-05
    p_uncond: 0.1
    mix_precision_mode: amp
    mix_precision_dtype: bfloat16
    elastic:
      name: LinearMemoryController
      args:
        target_ratio: 0.75
        max_mem_ratio_start: 0.5
    grad_clip:
      name: AdaptiveGradClipper
      args:
        max_norm: 1.0
        clip_percentile: 95
    finetune_ckpt:
      denoiser: microsoft/TRELLIS.2-4B/ckpts/slat_flow_imgshape2tex_dit_1_3B_512_bf16
    i_log: 50
    i_sample: 5000
    skip_initial_samples: true
    dataloader_num_workers: 8
    use_balanced_sampler: true
    num_sanity_val_steps: 0
    val_split_name: val
    val_every_epochs: 1        # recalibrate after the probe gives steps/sec
    val_batch_size_per_gpu: 4
    save_top_k: 1
    monitor_metric: val/loss
    monitor_mode: min
    # last.ckpt is 20 GB; fir Lustre write ~10-13 min. 2000-step cadence (~20 min
    # at 1.6 it/s) > write time so each refresh completes cleanly (see baseline).
    ckpt_last_every_n_steps: 2000
    wandb_enable: true
    wandb_project: emission-dit
    wandb_name: emission_dit_twostream_74k
    image_cond_model:
      name: DinoV3FeatureExtractor
      args:
        model_name: facebook/dinov3-vitl16-pretrain-lvd1689m
        image_size: 512

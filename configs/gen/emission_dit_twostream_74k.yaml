trainer:
  name: ImageConditionedSparseFlowMatchingCFGTrainer
  args:
    max_steps: 50000
    batch_size_per_gpu: 8     # probe may bump to 16
    # batch_split MUST be 1 with the elastic LinearMemoryController (see
    # emission_dit_74k.yaml for the full rationale).
    batch_split: 1
    optimizer:
      name: AdamW
      args:
        lr: 0.0001
        weight_decay: 0.01
        betas: [0.9, 0.95]
        eps: 1.0e-08
    lr_scheduler:
      name: LinearWarmupLRScheduler
      args:
        warmup_steps: 1000
    ema_rate:
    - 0.9999
    t_schedule:
      name: uniform
      args: {}
    sigma_min: 1.0e-05
    p_uncond: 0.1
    mix_precision_mode: amp
    mix_precision_dtype: bfloat16
    elastic:
      name: LinearMemoryController
      args:
        target_ratio: 0.75
        max_mem_ratio_start: 0.5
    grad_clip:
      name: AdaptiveGradClipper
      args:
        max_norm: 1.0
        clip_percentile: 95
    finetune_ckpt:
      denoiser: microsoft/TRELLIS.2-4B/ckpts/slat_flow_imgshape2tex_dit_1_3B_512_bf16
    i_log: 50
    i_sample: 5000
    skip_initial_samples: true
    dataloader_num_workers: 8
    use_balanced_sampler: true
    num_sanity_val_steps: 0
    val_split_name: val
    val_every_epochs: 1        # recalibrate after the probe gives steps/sec
    val_batch_size_per_gpu: 4
    save_top_k: 1
    monitor_metric: val/loss
    monitor_mode: min
    # last.ckpt is 20 GB; fir Lustre write ~10-13 min. 2000-step cadence (~20 min
    # at 1.6 it/s) > write time so each refresh completes cleanly (see baseline).
    ckpt_last_every_n_steps: 2000
    wandb_enable: true
    wandb_project: emission-dit
    wandb_name: emission_dit_twostream_74k
    image_cond_model:
      name: DinoV3FeatureExtractor
      args:
        model_name: facebook/dinov3-vitl16-pretrain-lvd1689m
        image_size: 512

# SegviGen-emissive, 256-native lane (owner correction, board lightning_port,
# 2026-08-26): trains directly on the 256-native voxel grid, reusing the
# team's shared production shape+pbr latents (Dongchen's latents_v2 tree,
# same as the emission DiT baseline emission_dit_pbr2emission_74k_v3_agentic.yaml)
# plus OUR new emission-mask npz (scripts_segvigen/build_output_tex_latents_256.py,
# job 8, 36,613 shapes, 0 errors) as the target. See
# trellis2/datasets/segvigen_256.py for the full source/normalization
# rationale. This REPLACES segvigen_emissive_direct.yaml's dataset_direct/512
# lane for the from-scratch fullseg finetune -- that config and its
# output_tex_slat.pth remain valid for other work, just not this launch.
#
# Model/trainer blocks are otherwise IDENTICAL to segvigen_emissive_direct.yaml
# (same architecture, same Option-A conservative LR/loss recipe, owner-set
# 2026-08-26): lr 1e-5 unscaled, unweighted loss, batch_size_per_gpu set by
# a per-GPU-class measurement (see board lightning_port for the number this
# run actually used -- state the effective batch in any report).
models:
  denoiser:
    name: SegviGenSLatFlowModel
    args:
      resolution: 32
      in_channels: 64
      out_channels: 32
      model_channels: 1536
      cond_channels: 1024
      num_blocks: 30
      num_heads: 12
      mlp_ratio: 5.3334
      pe_mode: rope
      share_mod: true
      initialization: scaled
      qk_rms_norm: true
      qk_rms_norm_cross: true
      dtype: bfloat16
dataset:
  name: SegviGenEmissive256
  args:
    data_root: /3dlg-jupiter-project/lightgen/trellis2_bw/lightgen_74k_newbake
    parquet_file: /3dlg-jupiter-project/lightgen/trellis2_bw/lightgen_74k_newbake/df_SomgProc_final.parquet
    split_json: /3dlg-jupiter-project/lightgen/trellis2_bw/lightgen_74k_newbake/data_splits_emissive_74k_stratified_newbake_vae_agentic.json
    split: train
    shape_latent_root: /3dlg-jupiter-project/lightgen/trellis2_bw/latents_v2
    shape_latent_name: shape_enc_next_dc_f16c32_fp16_256
    pbr_latent_root: /3dlg-jupiter-project/lightgen/trellis2_bw/latents_v2
    pbr_latent_name: tex_enc_next_dc_f16c32_fp16_256
    emission_latent_dir: /3dlg-falas/project/omages/lightgen/segvigen_emissive/outputs/latents_256/output_tex_latents/segvigen_emissive_mask_256
    cond_search_dirs:

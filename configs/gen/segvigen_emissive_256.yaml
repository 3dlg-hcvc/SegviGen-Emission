trainer:
  name: SegviGenFlowTrainer
  args:
    max_steps: 50000
    batch_size_per_gpu: 4   # provisional; recalibrate from this config's own probe before the 6-GPU launch
    batch_split: 1
    pos_weight: 1.0
    balanced_pos_weight: 0.0
    p_uncond: 0.0
    optimizer:
      name: AdamW
      args:
        lr: 1.0e-05
        weight_decay: 0.01
        betas:
        - 0.9
        - 0.999
        eps: 1.0e-08
    ema_rate:
    - 0.999
    t_schedule:
      name: uniform
      args: {}
    sigma_min: 1.0e-05
    mix_precision_mode: amp
    mix_precision_dtype: bfloat16
    elastic:
      name: LinearMemoryController
      args:
        target_ratio: 0.75
        max_mem_ratio_start: 0.3
    grad_clip:
      name: AdaptiveGradClipper
      args:
        max_norm: 1.0
        clip_percentile: 95
    finetune_ckpt:
      denoiser: /3dlg-falas/project/omages/lightgen/trellis2_lightning_probe/data/full_seg_rekeyed.pt
    i_log: 10
    i_sample: 0
    skip_initial_samples: true
    dataloader_num_workers: 8
    use_balanced_sampler: true
    num_sanity_val_steps: 0
    val_split_name: val
    val_every_epochs: 1
    val_batch_size_per_gpu: 4
    save_top_k: 1
    monitor_metric: val/loss
    monitor_mode: min
    ckpt_last_every_n_steps: 2000
    wandb_enable: false
    image_cond_model:
      name: DinoV3FeatureExtractor
      args:
        model_name: facebook/dinov3-vitl16-pretrain-lvd1689m
        image_size: 512

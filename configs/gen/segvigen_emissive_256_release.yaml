# SegviGen-Emission, 256-native lane, retrained on the released dataset (3dlg-hcvc/LightgenBench,
# jupiter datasets/dataset_release: train 36,426 / val 200 / test 200), 2026-09.
#
# The models: and trainer: blocks and both normalization blocks are the paper config's (the run
# segvigen_256_bw_6gpu; jupiter outputs/segvigen_256_bw_6gpu/config.yaml) unchanged: same architecture, init from full_seg, lr 1e-5,
# unweighted loss, 50k steps, stock TRELLIS.2 pipeline.json stats. What differs:
#   - every data location is a placeholder that script/lightgenbench/run_chain.sh train overrides; inputs come
#     from the producers in data_toolkit/ (README.md)
#   - effective batch stays 48: the paper ran 6 GPUs x 8, this lane runs 4 x H100 x 12
#   - ckpt_last_every_n_steps 755 -> 759 (36,426 train shapes / 48; the launcher sets the real value
#     from the usable count), wandb on (project LightGen)
models:
  denoiser:
    name: SegviGenSLatFlowModel
    args:
      resolution: 32
      in_channels: 64
      out_channels: 32
      model_channels: 1536
      cond_channels: 1024
      num_blocks: 30
      num_heads: 12
      mlp_ratio: 5.3334
      pe_mode: rope
      share_mod: true
      initialization: scaled
      qk_rms_norm: true
      qk_rms_norm_cross: true
      dtype: bfloat16
dataset:
  name: SegviGenEmissive256
  args:
    data_root: __SET_BY_LAUNCHER__
    parquet_file: __SET_BY_LAUNCHER__
    split_json: __SET_BY_LAUNCHER__
    split: train
    shape_latent_root: __SET_BY_LAUNCHER__
    shape_latent_name: shape_enc_next_dc_f16c32_fp16_256
    pbr_latent_root: __SET_BY_LAUNCHER__
    pbr_latent_name: tex_enc_next_dc_f16c32_fp16_256
    emission_latent_dir: __SET_BY_LAUNCHER__
    cond_search_dirs:

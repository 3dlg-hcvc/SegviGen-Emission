# SegviGen-emissive on the lightning framework: dataset_direct data,
# voxel-axis 2N conditioning (SegviGenSLatFlowModel), precomputed DINOv3
# cond (embedding mode), per-shape mean loss reduction, p_uncond 0.
# Normalization stats embedded verbatim from TRELLIS.2-4B pipeline.json.
# Init: full_seg rekeyed (640/640 keys, in_channels 64 so ALL tensors load).
#
# LOSS WEIGHTING (owner-set 2026-08-26): the production recipe trains
# UNWEIGHTED -- pos_weight 1.0, balanced_pos_weight 0.0 below, matching
# every real run (the July w5 per-voxel-weighted experiments lost and
# weighting was retired). require_mask is therefore false: emis_mask.pth
# is only needed when a config actually turns weighting back on.
# SegviGenFlowTrainer's weighting code stays in place (dormant, config-off)
# and the per-shape mean reduction applies regardless of weighting.
#
# LR / BATCH RECIPE (owner-ratified 2026-08-26, "Option A, conservative"):
# lr stays at 1e-5, unscaled, for every new lightning experiment -- no lr
# scaling with batch size or GPU count until a first full lightning
# training curve exists and has been reviewed. batch_size_per_gpu is set
# by available memory per GPU class (4 is the target, 2 is the fallback
# measured to fit on a 44GB A40; see the batch probe in the lightning_port
# board notes for the per-GPU-class numbers). Every run's config and report
# must state the EFFECTIVE batch size (batch_size_per_gpu * num_gpus *
# grad_accum) explicitly, since it is not fixed across runs under this
# recipe. This config's own effective batch = batch_size_per_gpu (4 below)
# * num_gpus passed on the command line * batch_split (1) -- state the
# product for whatever launch actually ran.
models:
  denoiser:
    name: SegviGenSLatFlowModel
    args:
      resolution: 32
      in_channels: 64
      out_channels: 32
      model_channels: 1536
      cond_channels: 1024
      num_blocks: 30
      num_heads: 12
      mlp_ratio: 5.3334
      pe_mode: rope
      share_mod: true
      initialization: scaled
      qk_rms_norm: true
      qk_rms_norm_cross: true
      dtype: bfloat16
dataset:
  name: SegviGenEmissiveDirect

# Finetune pretrained PBR VAE on emission data (~878 train samples)
#
# Strategy: pack emission RGB into PBR 6-channel format (base_color=emission,
# metallic=0, roughness=1, alpha=1), finetune from pretrained PBR VAE weights.
# Loss computed only on emission channels (first 3 of 6).
#
# Architecture matches the pretrained PBR VAE exactly (tex_enc/dec_next_dc_f16c32_fp16).
#
# Run:
#   conda run -n trellis2 python train.py \
#       --config configs/scvae/emission_pbr_finetune_1k.yaml \
#       --output_dir outputs/emission_pbr_finetune_1k \
#       --num_gpus 4

models:
  encoder:
    name: SparseUnetVaeEncoder
    args:
      in_channels: 6
      model_channels:
      - 64
      - 128
      - 256
      - 512
      - 1024
      latent_channels: 32
      num_blocks:
      - 0
      - 4
      - 8
      - 16
      - 4
      block_type:
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      down_block_type:
      - SparseResBlockS2C3d
      - SparseResBlockS2C3d
      - SparseResBlockS2C3d
      - SparseResBlockS2C3d
      block_args:
      - use_checkpoint: true
      - use_checkpoint: true
      - use_checkpoint: true
      - use_checkpoint: true
      - use_checkpoint: true
      use_fp16: false
  decoder:
    name: SparseUnetVaeDecoder
    args:
      out_channels: 6
      model_channels:
      - 1024
      - 512
      - 256
      - 128
      - 64
      latent_channels: 32
      num_blocks:
      - 4
      - 16
      - 8
      - 4
      - 0
      block_type:
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      up_block_type:
      - SparseResBlockC2S3d
      - SparseResBlockC2S3d
      - SparseResBlockC2S3d
      - SparseResBlockC2S3d
      block_args:
      - use_checkpoint: true
      - use_checkpoint: true
      - use_checkpoint: true
      - use_checkpoint: true
      - use_checkpoint: true
      use_fp16: false
      pred_subdiv: false

dataset:
  name: LightGenSLatEmission
  args:
    data_root: /local-scratch/localhome/dya78/lightgen_1k
    parquet_file: /local-scratch/localhome/dya78/lightgen_1k/df_SomgProc_emission_filtered.parquet
    resolution: 256
    split: train
    split_json: /local-scratch/localhome/dya78/lightgen_1k/data_splits_emission_filtered.json
    pbr_attrs:
    - base_color
    - metallic
    - roughness
    - alpha

trainer:
  name: EmissionPbrFinetuneTrainer
  args:
    max_steps: 20000
    batch_size_per_gpu: 32
    batch_split: 1
    optimizer:
      name: AdamW
      args:
        lr: 0.0001
        weight_decay: 0.0
    ema_rate:
    - 0.9999
    fp16_mode: inflat_all
    fp16_scale_growth: 0.001
    grad_clip:
      name: AdaptiveGradClipper
      args:
        max_norm: 1.0
        clip_percentile: 95
    loss_type: l1
    lambda_kl: 1.0e-07
    emission_channels: 3
    finetune_ckpt:
      encoder: microsoft/TRELLIS.2-4B/ckpts/tex_enc_next_dc_f16c32_fp16
      decoder: microsoft/TRELLIS.2-4B/ckpts/tex_dec_next_dc_f16c32_fp16
    i_log: 50
    i_sample: 2000
    i_save: 2000
    dataloader_num_workers: 4
    use_balanced_sampler: false
    num_sanity_val_steps: 0
    limit_val_batches: 0
    wandb_enable: true
    wandb_project: emission-vae-1k
    wandb_name: pbr-finetune-1k

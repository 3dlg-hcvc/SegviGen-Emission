# Finetune the pretrained TRELLIS PBR VAE on emission data, overfit on 10 samples.
#
# Strategy (channel hijacking, EmissionPbrFinetuneTrainer):
#   * Architecture is byte-identical to the production PBR VAE (6->6 channels,
#     64->1024, latent_channels=32) loaded from
#     microsoft/TRELLIS.2-4B/ckpts/tex_{enc,dec}_next_dc_f16c32_fp16.
#   * Input has emission RGB packed into the base_color slot; metallic/roughness/
#     alpha slots are filled with constants (-1, +1, +1).
#   * Loss is computed only on the first 3 output channels (emission).
#
# Sibling configs:
#   * emission_vae_10sample_overfit.yaml       -> two-stream concat VAE (from scratch, small arch, fp32)
#   * emission_pbr_vae_finetune_10sample.yaml  -> THIS FILE: overfit setup with val,
#                                                 oversampled split, fp16, EMA, AdaptiveGradClip
#   * emission_pbr_finetune_1k.yaml            -> same approach, full 1k training
#
# Run:
#   python data_toolkit/prep_10sample_as1k.py    # one-time: build split JSON
#   python train.py --config configs/scvae/emission_pbr_vae_finetune_10sample.yaml \
#       --output_dir outputs/emission_pbr_vae_finetune_10sample

models:
  encoder:
    name: SparseUnetVaeEncoder
    args:
      in_channels: 6
      model_channels:
      - 64
      - 128
      - 256
      - 512
      - 1024
      latent_channels: 32
      num_blocks:
      - 0
      - 4
      - 8
      - 16
      - 4
      block_type:
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      down_block_type:
      - SparseResBlockS2C3d
      - SparseResBlockS2C3d
      - SparseResBlockS2C3d
      - SparseResBlockS2C3d
      block_args:
      - use_checkpoint: true
      - use_checkpoint: true
      - use_checkpoint: true
      - use_checkpoint: true
      - use_checkpoint: true
      use_fp16: false
  decoder:
    name: SparseUnetVaeDecoder
    args:
      out_channels: 6
      model_channels:
      - 1024
      - 512
      - 256
      - 128
      - 64
      latent_channels: 32
      num_blocks:
      - 4
      - 16
      - 8
      - 4
      - 0
      block_type:
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      up_block_type:
      - SparseResBlockC2S3d
      - SparseResBlockC2S3d
      - SparseResBlockC2S3d
      - SparseResBlockC2S3d
      block_args:
      - use_checkpoint: true
      - use_checkpoint: true
      - use_checkpoint: true
      - use_checkpoint: true
      - use_checkpoint: true
      use_fp16: false
      pred_subdiv: false

dataset:
  name: LightGenSLatEmission
  args:
    data_root: data/lightgen_test
    parquet_file: data/lightgen_test/df_10samples.parquet
    resolution: 256
    # Use the oversampled split JSON so global_batch (num_gpus * batch_size_per_gpu)
    # fits cleanly within each rank's shard despite drop_last=True. Generate with:
    #   python data_toolkit/prep_10sample_as1k.py    # default TRAIN_SIZE=120
    # When scaling up to the real dataset, point at its split JSON instead.
    split: train
    split_json: data/lightgen_test/data_splits_10sample_as1k.json
    pbr_attrs:
    - base_color
    - metallic
    - roughness
    - alpha

trainer:
  name: EmissionPbrFinetuneTrainer
  args:
    max_steps: 6000
    batch_size_per_gpu: 16
    batch_split: 1
    optimizer:
      name: AdamW
      args:
        lr: 0.0001
        weight_decay: 0.0
    ema_rate:
    - 0.9999
    fp16_mode: inflat_all
    fp16_scale_growth: 0.001
    grad_clip:
      name: AdaptiveGradClipper
      args:
        max_norm: 1.0
        clip_percentile: 95
    loss_type: l1
    lambda_kl: 1.0e-07
    emission_channels: 3
    finetune_ckpt:
      encoder: microsoft/TRELLIS.2-4B/ckpts/tex_enc_next_dc_f16c32_fp16
      decoder: microsoft/TRELLIS.2-4B/ckpts/tex_dec_next_dc_f16c32_fp16
    # 4 GPU × BS=8 = global 32, TRAIN_SIZE=120 → 3 train batches/epoch (drop_last
    # drops 24). Default i_log=50 would flush 0 scalars per epoch — set to 1 so
    # every step lands in wandb / CSV. See CLAUDE.md "Logging-interval gotcha".
    i_log: 1
    i_sample: 2000
    # Checkpoint policy: keep the top-3 checkpoints by val/loss (plus last.ckpt
    # for resume). Saving is triggered at the end of every validation epoch
    # (see val_every_epochs below). `i_save` is ignored when `save_top_k` is set.
    save_top_k: 3
    monitor_metric: val/loss
    monitor_mode: min
    dataloader_num_workers: 16
    use_balanced_sampler: false
    # Validation on the 10 unique samples (same data as train) — val/loss
    # should track train/loss and approach 0 as the model memorizes.
    #
    # Frequency: 4 GPU × BS=8, TRAIN_SIZE=120 → 3 train batches/epoch (drop_last
    # drops 24). val_every_epochs=1 would fire val + top-K comparison every 3
    # steps — way too noisy / wasteful since training oscillates over a 3-step
    # window. val_every_epochs=100 fires every ~300 steps → ~67 well-spaced
    # top-K comparisons over a 20k-step run (EMA at 0.9999 damps remaining
    # oscillation between snapshots).
    val_split_name: val
    val_batch_size_per_gpu: 16
    val_every_epochs: 100
    num_sanity_val_steps: 0
    # Wandb is mandatory for all training runs (see CLAUDE.md "Run logging
    # policy"). Override `wandb_name` per-run via --override or env var so each
    # submission gets its own row in the dashboard.
    wandb_enable: true
    wandb_project: emission-pbr-vae-finetune
    wandb_name: emission_pbr_vae_ft_10sample

# Finetune the pretrained TRELLIS PBR VAE on emission data, full 1k subset.
#
# Strategy (channel hijacking, EmissionPbrFinetuneTrainer):
#   * Architecture is byte-identical to the production PBR VAE (6->6 channels,
#     64->1024, latent_channels=32) loaded from
#     microsoft/TRELLIS.2-4B/ckpts/tex_{enc,dec}_next_dc_f16c32_fp16.
#   * Input has emission RGB packed into the base_color slot; metallic/roughness/
#     alpha slots are filled with constants (-1, +1, +1).
#   * Loss is computed only on the first 3 output channels (emission).
#
# Sibling configs:
#   * emission_pbr_vae_finetune_10sample.yaml -> overfit-on-10-samples sibling
#                                                (same trainer/arch/training args,
#                                                oversampled split JSON for drop_last)
#   * emission_pbr_vae_finetune_1k.yaml       -> THIS FILE: ~1099 unique samples
#                                                with the real train/val split,
#                                                no oversampling needed
#
# Run:
#   python train.py --config configs/scvae/emission_pbr_vae_finetune_1k.yaml \
#       --output_dir outputs/emission_pbr_vae_finetune_1k

models:
  encoder:
    name: SparseUnetVaeEncoder
    args:
      in_channels: 6
      model_channels:
      - 64
      - 128
      - 256
      - 512
      - 1024
      latent_channels: 32
      num_blocks:
      - 0
      - 4
      - 8
      - 16
      - 4
      block_type:
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      down_block_type:
      - SparseResBlockS2C3d
      - SparseResBlockS2C3d
      - SparseResBlockS2C3d
      - SparseResBlockS2C3d
      block_args:
      - use_checkpoint: true
      - use_checkpoint: true
      - use_checkpoint: true
      - use_checkpoint: true
      - use_checkpoint: true
      use_fp16: false
  decoder:
    name: SparseUnetVaeDecoder
    args:
      out_channels: 6
      model_channels:
      - 1024
      - 512
      - 256
      - 128
      - 64
      latent_channels: 32
      num_blocks:
      - 4
      - 16
      - 8
      - 4
      - 0
      block_type:
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      up_block_type:
      - SparseResBlockC2S3d
      - SparseResBlockC2S3d
      - SparseResBlockC2S3d
      - SparseResBlockC2S3d
      block_args:
      - use_checkpoint: true
      - use_checkpoint: true
      - use_checkpoint: true
      - use_checkpoint: true
      - use_checkpoint: true
      use_fp16: false
      pred_subdiv: false

dataset:
  name: LightGenSLatEmission
  args:
    data_root: data/lightgen_1k
    parquet_file: data/lightgen_1k/df_SomgProc_emission_filtered.parquet
    resolution: 256
    # Real emission-filtered split from data prep — ~878 train + held-out val.
    # Unlike the 10-sample sibling we do NOT oversample: with 4 GPUs * BS=8 = 32
    # global batch, drop_last keeps 27 train batches/epoch (drops at most 31
    # samples), which is plenty.
    split: train
    split_json: data/lightgen_1k/data_splits_emission_filtered.json
    pbr_attrs:
    - base_color
    - metallic
    - roughness
    - alpha

trainer:
  name: EmissionPbrFinetuneTrainer
  args:
    max_steps: 20000
    batch_size_per_gpu: 16
    batch_split: 1
    optimizer:
      name: AdamW
      args:
        lr: 0.0001
        weight_decay: 0.0
    ema_rate:
    - 0.9999
    fp16_mode: inflat_all
    fp16_scale_growth: 0.001
    grad_clip:
      name: AdaptiveGradClipper
      args:
        max_norm: 1.0
        clip_percentile: 95
    loss_type: l1
    lambda_kl: 1.0e-07
    emission_channels: 3
    finetune_ckpt:
      encoder: microsoft/TRELLIS.2-4B/ckpts/tex_enc_next_dc_f16c32_fp16
      decoder: microsoft/TRELLIS.2-4B/ckpts/tex_dec_next_dc_f16c32_fp16
    # 4 GPU * BS=8 = global 32, ~878 train samples -> 27 train batches/epoch.
    # i_log=1 keeps wandb / CSV in sync with the 10sample sibling for direct
    # apples-to-apples comparison; bump if dashboard load becomes an issue.
    i_log: 1
    i_sample: 2000
    # Checkpoint policy: keep the top-3 checkpoints by val/loss (plus last.ckpt
    # for resume). Saving is triggered at the end of every validation epoch
    # (see val_every_epochs below). `i_save` is ignored when `save_top_k` is set.
    save_top_k: 3
    monitor_metric: val/loss
    monitor_mode: min
    dataloader_num_workers: 16
    use_balanced_sampler: false
    # Validation on the held-out val split. Frequency: 4 GPU * BS=8 ->
    # 27 train batches/epoch, val_every_epochs=100 fires every ~2700 steps ->
    # ~7 well-spaced top-K comparisons over a 20k-step run (EMA at 0.9999 damps
    # remaining oscillation between snapshots). Tighten by overriding from the
    # launcher if you want denser comparisons on a longer run.
    val_split_name: val
    val_batch_size_per_gpu: 16
    val_every_epochs: 100
    num_sanity_val_steps: 0
    # Wandb is mandatory for all training runs (see CLAUDE.md "Run logging
    # policy"). Override `wandb_name` per-run via --override or env var so each
    # submission gets its own row in the dashboard (the launcher appends a
    # date+time tag).
    wandb_enable: true
    wandb_project: emission-pbr-vae-finetune
    wandb_name: emission_pbr_vae_ft_1k

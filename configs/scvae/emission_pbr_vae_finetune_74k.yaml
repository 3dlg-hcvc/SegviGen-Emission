# Finetune the pretrained TRELLIS PBR VAE on emission data, full 74k subset.
#
# Strategy: identical to emission_pbr_vae_finetune_1k.yaml (channel hijacking,
# EmissionPbrFinetuneTrainer; arch byte-identical to production PBR VAE).
#
# Differences vs the 1k sibling (only dataset + training-budget knobs change;
# arch/optimizer are unchanged so the checkpoints stay interchangeable):
#   * dataset.args points at lightgen_74k (~73,472 sha256s, ~99 % coverage post
#     rank-2 backfill 2026-05-08).
#   * batch_size_per_gpu=48 (sweep on single H100 with 1k data: 60 GB peak →
#     74k worst-case batch ~70-75 GB, fits H100 80 GB with margin). See memory
#     project_fir_pbr_vae_bs_sweep.md for the full BS table.
#   * Designed for 4-GPU H100 fir node: global batch = 4 * 48 = 192. With ~73k
#     train samples = ~380 batches/epoch.
#   * max_steps=20000 → ~52 epochs. Original 1k config used 40k steps for
#     ~1500 epochs of 27 batches; 74k needs fewer epochs because each step
#     visits 192 samples (vs 32 in the 1k 4×L40S design).
#   * use_balanced_sampler stays true: 74k has fatter voxel-count tail than 1k,
#     so DDP load balancing is essential to avoid rank-skewed OOMs.

models:
  encoder:
    name: SparseUnetVaeEncoder
    args:
      in_channels: 6
      model_channels:
      - 64
      - 128
      - 256
      - 512
      - 1024
      latent_channels: 32
      num_blocks:
      - 0
      - 4
      - 8
      - 16
      - 4
      block_type:
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      down_block_type:
      - SparseResBlockS2C3d
      - SparseResBlockS2C3d
      - SparseResBlockS2C3d
      - SparseResBlockS2C3d
      block_args:
      - use_checkpoint: true
      - use_checkpoint: true
      - use_checkpoint: true
      - use_checkpoint: true
      - use_checkpoint: true
      use_fp16: false
  decoder:
    name: SparseUnetVaeDecoder
    args:
      out_channels: 6
      model_channels:
      - 1024
      - 512
      - 256
      - 128
      - 64
      latent_channels: 32
      num_blocks:
      - 4
      - 16
      - 8
      - 4
      - 0
      block_type:
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      up_block_type:
      - SparseResBlockC2S3d
      - SparseResBlockC2S3d
      - SparseResBlockC2S3d
      - SparseResBlockC2S3d
      block_args:
      - use_checkpoint: true
      - use_checkpoint: true
      - use_checkpoint: true
      - use_checkpoint: true
      - use_checkpoint: true
      use_fp16: false
      pred_subdiv: false

dataset:
  name: LightGenSLatEmission
  args:
    data_root: data/lightgen_74k
    parquet_file: data/lightgen_74k/df_SomgProc_final.parquet
    resolution: 256
    split: train
    # Voxel-availability-filtered subset of the stratified split (879 sha256s
    # dropped because their voxels were lost at prep time, ~1.2% of total).
    # See data_splits_emissive_74k_stratified.json for the unfiltered original.
    split_json: data/lightgen_74k/data_splits_emissive_74k_stratified_voxonly.json
    pbr_attrs:
    - base_color
    - metallic
    - roughness
    - alpha

trainer:
  name: EmissionPbrFinetuneTrainer
  args:
    max_steps: 20000
    # BS=16 per H100. Two OOMs on the way down on 74k:
    #   * BS=48 OOM'd rank 0 at step ~20 (job 39635199): 77 GB peak.
    #   * BS=32 OOM'd rank 2 at step ~40 (job 39635737): 76 GB peak.
    # The 74k voxel-count tail is materially fatter than the 1k extrapolation
    # predicted, and the file-size load proxy used by BalancedResumableSampler
    # (LightGenSLatEmission.self.loads = os.path.getsize(emission_vxz)) is
    # only ~0.7 correlated with actual VRAM, so even balanced DDP can land a
    # rank with multiple heavy samples. BS=16 gives ~3x VRAM headroom and
    # should survive worst-case 74k batches at the cost of throughput.
    # Future fix to recover BS=48: change self.loads to use voxel count
    # (coords.shape[0] from o_voxel.io.read_vxz) instead of file size — see
    # CLAUDE.md "Pick the right load proxy" + memory project_fir_pbr_vae_bs_sweep.md.
    batch_size_per_gpu: 16
    batch_split: 1
    optimizer:
      name: AdamW
      args:
        lr: 0.0001
        weight_decay: 0.0
    ema_rate:
    - 0.9999
    fp16_mode: inflat_all
    fp16_scale_growth: 0.001
    grad_clip:
      name: AdaptiveGradClipper
      args:
        max_norm: 1.0
        clip_percentile: 95
    loss_type: l1
    lambda_kl: 1.0e-07
    emission_channels: 3
    finetune_ckpt:
      encoder: microsoft/TRELLIS.2-4B/ckpts/tex_enc_next_dc_f16c32_fp16
      decoder: microsoft/TRELLIS.2-4B/ckpts/tex_dec_next_dc_f16c32_fp16
    # 4 GPU * BS=48 = global 192. ~73k train samples -> ~380 batches/epoch.
    # i_log=10 keeps wandb readable while still flushing several times per
    # epoch (vs i_log=1 in the 1k overfit setup).
    i_log: 10
    i_sample: 2000
    save_top_k: 3
    monitor_metric: val/loss
    monitor_mode: min
    dataloader_num_workers: 8
    # Balanced sampler is essential here: 74k voxel-count tail is fatter than
    # 1k (CLAUDE.md notes 348 samples skipped at prep due to >500 GB RAM
    # spike), and a permutation that concentrates large samples on one rank
    # will OOM under DDP. LightGenSLatEmission exposes self.loads.
    use_balanced_sampler: true
    val_split_name: val
    val_batch_size_per_gpu: 16
    val_every_epochs: 2
    num_sanity_val_steps: 0
    wandb_enable: true
    wandb_project: emission-pbr-vae-finetune
    wandb_name: emission_pbr_vae_ft_74k_4xh100

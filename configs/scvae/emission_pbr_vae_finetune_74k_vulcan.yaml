# Finetune the pretrained TRELLIS PBR VAE on emission data, full 74k subset,
# tuned for vulcan (Alliance Canada, L40S). Cold-start from microsoft PBR VAE
# weights — does NOT resume fir's run.
#
# Differences vs emission_pbr_vae_finetune_74k.yaml (the fir/H100 sibling):
#   * batch_size_per_gpu: 16 → 8.
#     L40S is 48 GB vs H100 80 GB. Fir's BS=16 peaked at ~60 GB; the same
#     working set on L40S would OOM. Half the per-GPU batch leaves headroom
#     for the fatter-than-1k voxel tail. NEEDS PROBE: confirm via a NODES=1
#     30-min smoke job before trusting the production launch. If BS=12
#     survives, bump and re-scale LR; if BS=8 OOMs, drop to 6.
#   * lr: 1e-4 → 1.4e-4 (≈ 1e-4 × sqrt(2)).
#     With NODES=4 × 4 L40S × BS=8 = global 128, double fir's global 64.
#     Sqrt-scaling rather than linear because AdaptiveGradClipper already
#     dampens variance; linear (2e-4) is plausible if BS=8 + 1.4e-4 trains
#     too slowly, but sqrt is the safer first cut and matches what worked
#     for similar PBR-VAE finetunes on L40S nodes earlier.
#   * max_steps: 20000 → 10000.
#     Sample-count budget matches: 20k * 64 = 1.28M ≈ 10k * 128. Same
#     ~17 epochs of 74k, just fewer optimizer steps because each one sees
#     more data. Bump if val/loss is still trending down at termination.
#   * val_every_epochs: 10 → 5.
#     Fewer epochs total (17 vs 52 in the original-design comment), so
#     halve the val cadence to keep the same number of validation pulses.
#   * wandb_name renamed to disambiguate from the fir run.
#
# Warm-start variant (deferred): to resume fir's progress instead of
# cold-starting, extract the encoder/decoder state_dicts from
# fir:~/scratch/.../outputs/emission_pbr_vae_ft_74k/ckpts/last.ckpt, rsync to
# vulcan, and swap `finetune_ckpt.{encoder,decoder}` to point at them.
# Optimizer/EMA state will be re-initialized (intentional — fir's optimizer
# moments are tuned to BS=64, not BS=128).

models:
  encoder:
    name: SparseUnetVaeEncoder
    args:
      in_channels: 6
      model_channels:
      - 64
      - 128
      - 256
      - 512
      - 1024
      latent_channels: 32
      num_blocks:
      - 0
      - 4
      - 8
      - 16
      - 4
      block_type:
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      down_block_type:
      - SparseResBlockS2C3d
      - SparseResBlockS2C3d
      - SparseResBlockS2C3d
      - SparseResBlockS2C3d
      block_args:
      - use_checkpoint: true
      - use_checkpoint: true
      - use_checkpoint: true
      - use_checkpoint: true
      - use_checkpoint: true
      use_fp16: false
  decoder:
    name: SparseUnetVaeDecoder
    args:
      out_channels: 6
      model_channels:
      - 1024
      - 512
      - 256
      - 128
      - 64
      latent_channels: 32
      num_blocks:
      - 4
      - 16
      - 8
      - 4
      - 0
      block_type:
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      up_block_type:
      - SparseResBlockC2S3d
      - SparseResBlockC2S3d
      - SparseResBlockC2S3d
      - SparseResBlockC2S3d
      block_args:
      - use_checkpoint: true
      - use_checkpoint: true
      - use_checkpoint: true
      - use_checkpoint: true
      - use_checkpoint: true
      use_fp16: false
      pred_subdiv: false

dataset:
  name: LightGenSLatEmission
  args:
    data_root: data/lightgen_74k
    parquet_file: data/lightgen_74k/df_SomgProc_final.parquet
    resolution: 256
    split: train
    split_json: data/lightgen_74k/data_splits_emissive_74k_stratified_voxonly.json
    pbr_attrs:
    - base_color
    - metallic
    - roughness
    - alpha

trainer:
  name: EmissionPbrFinetuneTrainer
  args:
    max_steps: 10000
    batch_size_per_gpu: 8
    batch_split: 1
    optimizer:
      name: AdamW
      args:
        lr: 0.00014
        weight_decay: 0.0
    ema_rate:
    - 0.9999
    fp16_mode: inflat_all
    fp16_scale_growth: 0.001
    grad_clip:
      name: AdaptiveGradClipper
      args:
        max_norm: 1.0
        clip_percentile: 95
    loss_type: l1
    lambda_kl: 1.0e-07
    emission_channels: 3
    finetune_ckpt:
      encoder: microsoft/TRELLIS.2-4B/ckpts/tex_enc_next_dc_f16c32_fp16
      decoder: microsoft/TRELLIS.2-4B/ckpts/tex_dec_next_dc_f16c32_fp16
    i_log: 10
    i_sample: 2000
    save_top_k: 1
    monitor_metric: val/loss
    monitor_mode: min
    dataloader_num_workers: 8
    use_balanced_sampler: true
    val_split_name: val
    val_batch_size_per_gpu: 8
    val_every_epochs: 5
    num_sanity_val_steps: 0
    wandb_enable: true
    wandb_project: emission-pbr-vae-finetune
    wandb_name: emission_pbr_vae_ft_74k_vulcan_16xl40s

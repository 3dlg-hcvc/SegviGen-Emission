# albedo->emission VAE, EMISSIVE-ONLY TRAINING SET -- stage 1 of 2 (constant LR).
#
# The experiment: does dropping the shapes that bake to zero emission from the
# training set produce a better emission generator? Train drops 71,646 -> 65,463;
# val (387) and test (388) pass through UNCHANGED, so this run and its baseline
# select checkpoints under an identical criterion and differ only in what they
# trained on.
#
# Provenance: copied from the baseline's own config.yaml, the one saved beside
# jupiter trellis2_bw/latents_v2/vae_ckpts/albedo2emission/step0034800-0.0056.ckpt
# -- not from the stale configs/scvae/emission_pbr_vae_finetune_74k.yaml, which
# still points at the pre-newbake lightgen_74k tree.
#
# Finetunes from the PRETRAINED PBR VAE, never from the baseline _v2 checkpoint:
# continuing that one would carry forward a VAE that has already seen the
# zero-emission shapes and would make the whole comparison meaningless. Note
# that an ABSENT finetune_ckpt block is completely silent -- _apply_finetune_
# checkpoint returns without even a warning (trainers/basic.py:406-409) and the
# VAE trains from random init. That is what invalidated the pbr->emission
# baseline. A wrong PATH, by contrast, raises FileNotFoundError. Never "fix" a
# path error by deleting the block.
#
# Site: fir, 4x H100. Deltas from the baseline recipe, each justified inline
# below: split_json, pbr_attrs [], max_steps + no scheduler (stage 1 of 2),
# batch_size_per_gpu 16 (holds global batch 64 on 80 GB cards), wandb name.
#
# Plan: docs/superpowers/plans/2026-08-15-trellis2-albedo-nonzero-training.md
models:
  encoder:
    name: SparseUnetVaeEncoder
    args:
      in_channels: 6
      model_channels:
      - 64
      - 128
      - 256
      - 512
      - 1024
      latent_channels: 32
      num_blocks:
      - 0
      - 4
      - 8
      - 16
      - 4
      block_type:
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      down_block_type:
      - SparseResBlockS2C3d
      - SparseResBlockS2C3d
      - SparseResBlockS2C3d
      - SparseResBlockS2C3d
      block_args:
      - use_checkpoint: true
      - use_checkpoint: true
      - use_checkpoint: true
      - use_checkpoint: true
      - use_checkpoint: true
      use_fp16: false
  decoder:
    name: SparseUnetVaeDecoder
    args:
      out_channels: 6
      model_channels:
      - 1024
      - 512
      - 256
      - 128
      - 64
      latent_channels: 32
      num_blocks:
      - 4
      - 16
      - 8
      - 4
      - 0
      block_type:
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      up_block_type:
      - SparseResBlockC2S3d
      - SparseResBlockC2S3d
      - SparseResBlockC2S3d
      - SparseResBlockC2S3d
      block_args:
      - use_checkpoint: true
      - use_checkpoint: true
      - use_checkpoint: true
      - use_checkpoint: true
      - use_checkpoint: true
      use_fp16: false
      pred_subdiv: false
dataset:
  name: LightGenSLatEmission
  args:
    data_root: data/lightgen_74k_newbake
    parquet_file: data/lightgen_74k_newbake/df_SomgProc_final.parquet
    resolution: 256
    split: train
    split_json: data/lightgen_74k_newbake/data_splits_emissive_74k_stratified_newbake_vae_nonzero.json
    # Empty on purpose, and a verified no-op for this trainer: EmissionPbrFinetuneTrainer
    # ._pack_emission_as_pbr takes x.feats[:, :3] (emission) and fills metallic/
    # roughness/alpha with the constants (-1, +1, +1), so every PBR channel the
    # loader would read is overwritten before the encoder sees it
    # (trellis2/trainers/vae/emission_pbr_finetune.py:54-65). With [] the dataset
    # skips reading pbr_voxels_256/*.vxz entirely (lightgen_slat.py:320-328).
    # This is what lets fir hold this dataset at all: it halves both the bytes
    # (4.2 GB instead of 8.4 GB) and, decisively, the file count -- fir's /scratch
    # inode quota is the binding constraint, not disk space.
    pbr_attrs: []
trainer:
  name: EmissionPbrFinetuneTrainer
  args:
    # Stage 1 of 2. The baseline's LR curve was NOT produced by one run of this
    # config: it ran at constant 1e-4 to 25.8k steps and only then resumed with a
    # fresh cosine (T_max 10000, eta_min 1e-6) that ended at max_steps 35800, best
    # at 34.8k. Running the shipped config once from step 0 would reach eta_min by
    # step 10k and then climb back up the cosine's second half -- a different
    # schedule, which would void the comparison. Stage 2 lives in
    # emission_pbr_vae_ft_74k_v2_nonzero_cosine.yaml and resumes this run.
    max_steps: 25800
    # 16, not the baseline's 32, because this runs on fir's 80 GB H100s while the
    # baseline ran on venus-19's 96 GB Pro 6000 SE. BS 32 on the newbake long tail
    # peaked at 74 GB there and OOM'd an H100-80G outright (docs/status/
    # checkpoints.md, 2026-07-23). 4 GPUs x 16 holds the baseline's GLOBAL batch of
    # 64, which is what the optimizer actually sees -- so this is a site
    # adaptation, not a recipe change.
    batch_size_per_gpu: 16
    batch_split: 1
    optimizer:
      name: AdamW
      args:
        lr: 0.0001
        weight_decay: 0.0
    # NO lr_scheduler in stage 1 -- constant LR 1e-4. build_lr_scheduler returns
    # None for an absent block and configure_optimizers then returns the bare
    # optimizer, with no default scheduler substituted (trainers/basic.py:109-114).
    ema_rate:
    - 0.9999
    fp16_mode: inflat_all
    fp16_scale_growth: 0.001
    grad_clip:
      name: AdaptiveGradClipper
      args:
        max_norm: 1.0
        clip_percentile: 95
    loss_type: l1
    lambda_kl: 1.0e-07
    emission_channels: 3
    finetune_ckpt:
      encoder: /home/dya78/.cache/huggingface/hub/models--microsoft--TRELLIS.2-4B/snapshots/af44b45f2e35a493886929c6d786e563ec68364d/ckpts/tex_enc_next_dc_f16c32_fp16.safetensors
      decoder: /home/dya78/.cache/huggingface/hub/models--microsoft--TRELLIS.2-4B/snapshots/af44b45f2e35a493886929c6d786e563ec68364d/ckpts/tex_dec_next_dc_f16c32_fp16.safetensors
    i_log: 10
    i_sample: 2000
    save_top_k: 1
    monitor_metric: val/loss
    monitor_mode: min
    dataloader_num_workers: 8
    use_balanced_sampler: true
    val_split_name: val
    val_batch_size_per_gpu: 16
    val_every_epochs: 1
    num_sanity_val_steps: 0
    wandb_enable: true
    wandb_project: LightGen
    wandb_name: vae_albedo->emission_74k_v2_nonzero

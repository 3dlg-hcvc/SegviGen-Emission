# albedo->emission VAE, v3 -- PBR conditioning at the decoder.
#
# WHAT THIS CHAIN IS. Emission RGB is packed into the pretrained PBR VAE's
# base_color slot and metallic/roughness/alpha are filled with the constants
# (-1, +1, +1) (emission_pbr_finetune.py:54-65); the loss is taken on the first
# 3 output channels only (:99). That is why the I/O stays 6->6 and why 100% of
# the pretrained tex_enc/tex_dec transfers with no reshaped tensor. The other
# chain instead trains a dedicated 3-channel emission encoder. THAT -- the
# emission-latent representation -- is the whole difference between them.
#
# WHAT CHANGES vs albedo->emission v2 (step0034800-0.0056): the decoder's
# latent_channels 32 -> 64, so it consumes cat([z_emission 32, z_pbr 32]). The
# pbr->emission decoder has had that input since its own v3; this closes the
# last conditioning asymmetry between the two chains. The DiT stage is
# unaffected -- the latent is still 32ch, so the DiT stays in=96 / out=32.
#
# Design + plan:
#   docs/superpowers/specs/2026-08-16-trellis2-albedo2emission-vae-pbr-condition-design.md
#   docs/superpowers/plans/2026-08-16-trellis2-albedo2emission-vae-pbr-condition.md
#
# DERIVED FROM configs/scvae/emission_vae_pbr2emission_74k_v3.yaml, ON PURPOSE.
# Copying the OTHER CHAIN'S config and editing 12 fields means every recipe
# field the two must share is inherited verbatim rather than reconciled by hand:
# split, max_steps, the cosine schedule, batch sizes, lr, lambda_kl, loss, EMA,
# grad clip, sampler, checkpoint policy. Measured over the flattened configs:
# 104 leaf fields, 92 identical, 12 differing -- and all 12 are the chain
# identity or a direct consequence of it:
#   models.encoder.args.in_channels        3 -> 6    base_color-slot packing
#   models.decoder.args.out_channels       3 -> 6    ditto; loss takes [:, :3]
#   trainer.name                    EmissionVaeTrainer -> EmissionPbrFinetuneTrainer
#   dataset.args.pbr_attrs           4 attrs -> []    the pack overwrites 3:6 anyway
#   dataset.args.pbr_latent_name         added        supplies pbr_latent
#   trainer.args.pretrained_pbr_encoder  DELETED      no live encoder on this chain
#   trainer.args.finetune_ckpt.{enc,dec} albedo2emission_v3/*
#   trainer.args.wandb_name
# Guard: data_toolkit/verify_albedo2emission_v3/ has a field-diff check that
# asserts exactly this set. Re-run it after any edit here.
#
# RESIDUAL, STATED RATHER THAN HIDDEN. Matching pbr->emission v3 means this
# recipe NO LONGER matches albedo v2, whose realized LR curve was constant 1e-4
# to 25.8k then a resumed short cosine to 35.8k across two jobs. So albedo
# v2 -> v3 is not a single-variable comparison. That is the right trade: the
# comparison this work exists to make is v3 against v3.
#
# EXACTLY ONE TENSOR CHANGES SHAPE vs v2:
#   decoder.from_latent.weight    (1024, 32) -> (1024, 64)
# and it is NOT left random. BasicTrainer._load_weights_for_model DROPS
# shape-mismatched tensors with a single warning (trainers/basic.py:388-394),
# which would put xavier noise on the decoder's only latent gateway -- the exact
# failure that invalidated the shipped pbr->emission _v2. So it is resolved
# offline by data_toolkit/bake_albedo2emission_v3_init.py: cols 0:32 are the
# pretrained projection, cols 32:64 (the new z_pbr stream) are ZERO. The decoder
# at step 0 is then exactly the pretrained function of the emission latent --
# verified element-wise, max_abs_diff 0.0 against the v2 decoder, not merely
# equal in mean L1 (data_toolkit/verify_albedo2emission_v3/results.json).
#
# Regenerate the init (gitignored, deterministic; the launcher does this in the
# job body so cluster nodes need no rsync):
#   python data_toolkit/bake_albedo2emission_v3_init.py --out data/ckpt_init/albedo2emission_v3
#   python data_toolkit/verify_albedo2emission_v3/verify_identity.py
#
# PBR LATENT SOURCE: the pre-encoded production latents, raw and unnormalized --
# the same npz files the DiT stage and both predict_emission_voxels*.py scripts
# already read. pbr_attrs stays [] so pbr_voxels_256/ is never touched; fir's
# /scratch INODE quota is the binding constraint, not disk space. Coverage was
# verified per shape, not by file count: 72,421/72,421 across train/val/test.
#
# BATCH SIZES ARE INHERITED AND ADAPTED IN THE LAUNCHER, not here.
# batch_size_per_gpu 32 is venus-19's value; script/fir/emission_pbr_vae_ft_74k_v3.sh
# overrides it to 16 so 4 GPUs hold the same GLOBAL batch of 64. val_batch_size_per_gpu
# 32 is inherited DELIBERATELY: val/loss is a per-batch voxel mean reduced with
# sample-count weighting (basic.py:187-203), so the two chains must validate at the
# same grouping or their val/loss are not commensurable -- and save_top_k: 1 selects
# on it.
models:
  encoder:
    name: SparseUnetVaeEncoder
    args:
      in_channels: 6          # emission in the base_color slot + (-1,+1,+1) pad
      model_channels:
      - 64
      - 128
      - 256
      - 512
      - 1024
      latent_channels: 32     # keeps the DiT at in=96 / out=32
      num_blocks:
      - 0
      - 4
      - 8
      - 16
      - 4
      block_type:
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      down_block_type:
      - SparseResBlockS2C3d
      - SparseResBlockS2C3d
      - SparseResBlockS2C3d
      - SparseResBlockS2C3d
      block_args:
      - use_checkpoint: true
      - use_checkpoint: true
      - use_checkpoint: true
      - use_checkpoint: true
      - use_checkpoint: true
      use_fp16: false
  decoder:
    name: SparseUnetVaeDecoder
    args:
      out_channels: 6         # 6 out, loss on the first 3 (emission_pbr_finetune.py:99)
      model_channels:
      - 1024
      - 512
      - 256
      - 128
      - 64
      latent_channels: 64     # cat(z_emission 32, z_pbr 32) — forces from_latent reinit
      num_blocks:
      - 4
      - 16
      - 8
      - 4
      - 0
      block_type:
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      up_block_type:
      - SparseResBlockC2S3d
      - SparseResBlockC2S3d
      - SparseResBlockC2S3d
      - SparseResBlockC2S3d
      block_args:
      - use_checkpoint: true
      - use_checkpoint: true
      - use_checkpoint: true
      - use_checkpoint: true
      - use_checkpoint: true
      use_fp16: false
      pred_subdiv: false
dataset:
  name: LightGenSLatEmission
  args:
    data_root: data/lightgen_74k_newbake
    parquet_file: data/lightgen_74k_newbake/df_SomgProc_final.parquet
    resolution: 256
    split: train
    split_json: data/lightgen_74k_newbake/data_splits_emissive_74k_stratified_newbake_vae.json
    # Empty on purpose, and a verified no-op: _pack_emission_as_pbr overwrites
    # channels 3:6 with constants before the encoder sees them, so reading
    # pbr_voxels_256/*.vxz is pure I/O cost (lightgen_slat.py:320-328).
    pbr_attrs: []
    # THE conditioning input -- raw, unnormalized (lightgen_slat.py:334-338).
    pbr_latent_name: tex_enc_next_dc_f16c32_fp16_256
trainer:
  name: EmissionPbrFinetuneTrainer
  args:
    # Budget copied from the albedo chain (was 160000 with no scheduler).
    max_steps: 35800
    # The launcher overrides this to hold GLOBAL batch 64 — the albedo chain's —
    # across whatever GPU count it uses (default 4 x 16), and refuses to submit
    # if the product is not 64. This value applies only if train.py is invoked
    # directly on 2 GPUs.
    batch_size_per_gpu: 32
    batch_split: 1
    optimizer:
      name: AdamW
      args:
        lr: 0.0001
        weight_decay: 0.0
    # T_max MUST equal max_steps. CosineAnnealingLR is periodic with period
    # 2*T_max, so T_max 10000 over a 35,800-step run does not anneal — lr returns
    # to the full 1e-4 at step 20,000 and the run would END at 6.28e-5 on a
    # RISING limb. (T_max 10000 is what the albedo->emission chain used, but that
    # was a ~9k-step RESUMED tail leg after a constant-LR plateau, so its cosine
    # stayed inside the first descending half-period. Copying the number without
    # the context inverts its meaning.)
    #
    # Residual difference from albedo->emission, stated rather than hidden: that
    # chain's realized schedule was constant-LR to plateau then a short cosine
    # tail; this is one smooth cosine over the whole run. Reproducing its two-leg
    # trajectory exactly would need two jobs; a single full-length anneal is the
    # standard alternative and strictly better than a schedule that never anneals.
    lr_scheduler:
      name: CosineAnnealingLR
      args:
        T_max: 35800
        eta_min: 1.0e-06
    ema_rate:
    - 0.9999
    fp16_mode: inflat_all
    fp16_scale_growth: 0.001
    grad_clip:
      name: AdaptiveGradClipper
      args:
        max_norm: 1.0
        clip_percentile: 95
    loss_type: l1
    lambda_kl: 1.0e-07
    emission_channels: 3
    # THE FIX, part 2 — PRE-BAKED initial weights, not the raw hub files.
    #
    # Pointing this at the raw pretrained pair loads 564 of 568 tensors and drops
    # the 4 shape-mismatched ones (basic.py:385-394 skips, it does not adapt), so
    # `encoder.input_layer` and `decoder.from_latent` — both ON the information
    # path — stay at xavier init and the pretrained interior is fed a
    # distribution it never saw. Measured step-0 train/l1 on real voxels:
    #   albedo->emission reference   0.00488
    #   raw hub files (skip)         1.77424   <- worse than predicting a constant (0.94108)
    #   these baked files            0.00488   <- identical to the reference, to 5e-8
    # (data_toolkit/verify_pbr2emission_v3/results.json)
    #
    # bake_pbr2emission_v3_init.py resolves all four offline, so the trainer does
    # a clean 284/284 load through UNMODIFIED code. That is why this is a baked
    # file and not a trainer flag: the five DiT configs deliberately reinitialize
    # a mismatched 64->96 input projection, and a generic "adapt mismatched
    # shapes" option would silently change the init behind the shipped
    # 0.3326 / 0.3224 numbers. Here there is no flag to set wrong.
    #
    # Regenerate (gitignored, ~1.6 GB, deterministic — the launcher does this in
    # the job body so cluster nodes need no rsync):
    #   python data_toolkit/bake_pbr2emission_v3_init.py \
    #       --out data/ckpt_init/pbr2emission_v3 \
    #       --verify-config configs/scvae/emission_vae_pbr2emission_74k_v3.yaml
    finetune_ckpt:
      encoder: data/ckpt_init/albedo2emission_v3/encoder.safetensors
      decoder: data/ckpt_init/albedo2emission_v3/decoder.safetensors
    # NO pretrained_pbr_encoder on this chain: z_pbr is read from disk, not encoded
    # live. EmissionPbrFinetuneTrainer does not accept the arg, and BasicTrainer
    # setattrs any unrecognized trainer arg without complaint (basic.py:86) -- so
    # leaving it here would read as if a frozen encoder were involved. Deleted.
    i_log: 10
    i_sample: 2000
    save_top_k: 1
    monitor_metric: val/loss
    monitor_mode: min
    dataloader_num_workers: 8
    use_balanced_sampler: true
    val_split_name: val
    val_batch_size_per_gpu: 32
    val_every_epochs: 1
    num_sanity_val_steps: 0
    wandb_enable: true
    wandb_project: LightGen
    wandb_name: vae_albedo->emission_74k_v3

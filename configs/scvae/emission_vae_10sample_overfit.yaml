# Overfit config: emission VAE (Option B) trained on 10 samples
#
# Architecture mirrors Option B: encoder takes emission-only (3ch),
# decoder takes emission latent (32ch) concatenated with PBR latent (32ch) = 64ch input.
#
# Run:
#   conda run -n trellis2 python train.py \
#       --config configs/scvae/emission_vae_10sample_overfit.yaml \
#       --output_dir /tmp/emission_vae_10sample_overfit --ckpt none

models:
  encoder:
    name: SparseUnetVaeEncoder
    args:
      in_channels: 3
      model_channels:
      - 32
      - 64
      - 128
      - 256
      - 512
      latent_channels: 32
      num_blocks:
      - 0
      - 2
      - 4
      - 8
      - 2
      block_type:
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      down_block_type:
      - SparseResBlockS2C3d
      - SparseResBlockS2C3d
      - SparseResBlockS2C3d
      - SparseResBlockS2C3d
      block_args:
      - use_checkpoint: false
      - use_checkpoint: false
      - use_checkpoint: false
      - use_checkpoint: false
      - use_checkpoint: false
      use_fp16: false
  decoder:
    name: SparseUnetVaeDecoder
    args:
      out_channels: 3
      model_channels:
      - 512
      - 256
      - 128
      - 64
      - 32
      latent_channels: 64              # 32 emission + 32 PBR (Option B)
      num_blocks:
      - 2
      - 8
      - 4
      - 2
      - 0
      block_type:
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      up_block_type:
      - SparseResBlockC2S3d
      - SparseResBlockC2S3d
      - SparseResBlockC2S3d
      - SparseResBlockC2S3d
      block_args:
      - use_checkpoint: false
      - use_checkpoint: false
      - use_checkpoint: false
      - use_checkpoint: false
      - use_checkpoint: false
      use_fp16: false
      pred_subdiv: false

dataset:
  name: LightGenSLatEmission
  args:
    data_root: data/lightgen_test
    parquet_file: data/lightgen_test/df_10samples.parquet
    resolution: 256
    # Use the oversampled split JSON so global_batch (num_gpus * batch_size_per_gpu)
    # fits cleanly within each rank's shard despite drop_last=True. Generate with:
    #   python data_toolkit/prep_10sample_as1k.py    # default TRAIN_SIZE=120
    # When scaling up to the real dataset, point at its split JSON instead.
    split: train
    split_json: data/lightgen_test/data_splits_10sample_as1k.json
    pbr_attrs:
    - base_color
    - metallic
    - roughness
    - alpha

trainer:
  name: EmissionVaeTrainer
  args:
    max_steps: 10000
    batch_size_per_gpu: 8
    batch_split: 1
    optimizer:
      name: AdamW
      args:
        lr: 0.001
        weight_decay: 0.0
    loss_type: l1
    lambda_kl: 1.0e-07
    emission_channels: 3
    pretrained_pbr_encoder: microsoft/TRELLIS.2-4B/ckpts/tex_enc_next_dc_f16c32_fp16
    i_log: 50
    i_sample: 500
    # Checkpoint policy: keep the top-3 checkpoints by val/loss (plus last.ckpt
    # for resume). Saving is triggered at the end of every validation epoch
    # (see val_every_epochs below). `i_save` is ignored when `save_top_k` is set.
    save_top_k: 3
    monitor_metric: val/loss
    monitor_mode: min
    dataloader_num_workers: 0
    fp16_mode: null
    use_balanced_sampler: false
    # Validation on the 10 unique samples (same data as train) every epoch —
    # val/loss should track train/loss and approach 0 as the model memorizes.
    val_split_name: val
    val_batch_size_per_gpu: 8
    val_every_epochs: 1
    num_sanity_val_steps: 0

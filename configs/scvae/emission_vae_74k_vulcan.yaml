# Two-stream concat VAE (Option B) on full 74k subset, tuned for vulcan
# (Alliance Canada, L40S 48 GB, NODES=4 × 4 GPUs = 16 global).
#
# Architecture: trainable emission encoder (3→32) + frozen pretrained PBR
# encoder (PBR→32); decoder receives concat(z_emission, z_pbr) = 64 channels.
# Output is 3-channel emission only.
#
# Sized to mirror the channel-hijack 74k config in spirit (same dataset,
# same global batch size). Differences from emission_vae_10sample_overfit.yaml:
#   * dataset → 74k tars (data_root + parquet + split_json overridden at submit time)
#   * batch_size_per_gpu: 8 (L40S 48GB; emission encoder is smaller than PBR
#     so this should be conservative — bump after probe if headroom shows)
#   * lr: 0.001 (overfit) → 1.4e-4 (≈ 1e-4 × sqrt(2) to match the channel-
#     hijack 74k_vulcan config — same global batch of 128)
#   * max_steps: 10000 (matches the channel-hijack 74k_vulcan sample-budget)
#   * val_every_epochs: 5 (≈17 epochs over 74k, enough val pulses)
#   * use_balanced_sampler: true (avoid rank OOM from voxel-count skew)
#   * dataloader_num_workers: 8
#   * wandb_enable: true, wandb_project: emission-vae-twostream, named per run

models:
  encoder:
    name: SparseUnetVaeEncoder
    args:
      in_channels: 3
      model_channels:
      - 32
      - 64
      - 128
      - 256
      - 512
      latent_channels: 32
      num_blocks:
      - 0
      - 2
      - 4
      - 8
      - 2
      block_type:
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      down_block_type:
      - SparseResBlockS2C3d
      - SparseResBlockS2C3d
      - SparseResBlockS2C3d
      - SparseResBlockS2C3d
      block_args:
      - use_checkpoint: true
      - use_checkpoint: true
      - use_checkpoint: true
      - use_checkpoint: true
      - use_checkpoint: true
      use_fp16: false
  decoder:
    name: SparseUnetVaeDecoder
    args:
      out_channels: 3
      model_channels:
      - 512
      - 256
      - 128
      - 64
      - 32
      latent_channels: 64              # 32 emission + 32 PBR concat
      num_blocks:
      - 2
      - 8
      - 4
      - 2
      - 0
      block_type:
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      up_block_type:
      - SparseResBlockC2S3d
      - SparseResBlockC2S3d
      - SparseResBlockC2S3d
      - SparseResBlockC2S3d
      block_args:
      - use_checkpoint: true
      - use_checkpoint: true
      - use_checkpoint: true
      - use_checkpoint: true
      - use_checkpoint: true
      use_fp16: false
      pred_subdiv: false

dataset:
  name: LightGenSLatEmission
  args:
    data_root: data/lightgen_74k
    parquet_file: data/lightgen_74k/df_SomgProc_final.parquet
    resolution: 256
    split: train
    split_json: data/lightgen_74k/data_splits_emissive_74k_stratified_voxonly.json
    pbr_attrs:
    - base_color
    - metallic
    - roughness
    - alpha

trainer:
  name: EmissionVaeTrainer
  args:
    max_steps: 10000
    batch_size_per_gpu: 8
    batch_split: 1
    optimizer:
      name: AdamW
      args:
        lr: 0.00014
        weight_decay: 0.0
    ema_rate:
    - 0.9999
    fp16_mode: inflat_all
    fp16_scale_growth: 0.001
    grad_clip:
      name: AdaptiveGradClipper
      args:
        max_norm: 1.0
        clip_percentile: 95
    loss_type: l1
    lambda_kl: 1.0e-07
    emission_channels: 3
    pretrained_pbr_encoder: microsoft/TRELLIS.2-4B/ckpts/tex_enc_next_dc_f16c32_fp16
    i_log: 10
    i_sample: 2000
    save_top_k: 1
    monitor_metric: val/loss
    monitor_mode: min
    dataloader_num_workers: 8
    use_balanced_sampler: true
    val_split_name: val
    val_batch_size_per_gpu: 8
    val_every_epochs: 5
    num_sanity_val_steps: 0
    wandb_enable: true
    wandb_project: emission-vae-twostream
    wandb_name: emission_vae_twostream_74k_vulcan_16xl40s

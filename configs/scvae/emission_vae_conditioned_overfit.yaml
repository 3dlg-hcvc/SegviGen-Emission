# Overfit config: emission VAE conditioned on PBR material + geometry
#
# Architecture mirrors the PBR material VAE (tex_vae_next_dc_f16c32_fp16.yaml):
#   encoder  in_channels  = 9  (emission[3] + base_color[3] + metallic[1] + roughness[1] + alpha[1])
#   decoder  out_channels = 3  (emission only — reconstruction target)
#   loss     L1 on x[:, :3]
#
# Run:
#   conda run -n trellis2 python train.py \
#       --config configs/scvae/emission_vae_conditioned_overfit.yaml \
#       --output_dir /tmp/emission_vae_cond_overfit  --ckpt none

models:
  encoder:
    name: SparseUnetVaeEncoder
    args:
      in_channels: 9         # emission(3) + base_color(3) + metallic(1) + roughness(1) + alpha(1)
      model_channels:
      - 32
      - 64
      - 128
      latent_channels: 8
      num_blocks:
      - 0
      - 2
      - 4
      block_type:
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      down_block_type:
      - SparseResBlockS2C3d
      - SparseResBlockS2C3d
      block_args:
      - use_checkpoint: false
      - use_checkpoint: false
      - use_checkpoint: false
      use_fp16: false
  decoder:
    name: SparseUnetVaeDecoder
    args:
      out_channels: 3        # reconstruct emission only
      model_channels:
      - 128
      - 64
      - 32
      latent_channels: 8
      num_blocks:
      - 4
      - 2
      - 0
      block_type:
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      up_block_type:
      - SparseResBlockC2S3d
      - SparseResBlockC2S3d
      block_args:
      - use_checkpoint: false
      - use_checkpoint: false
      - use_checkpoint: false
      use_fp16: false
      pred_subdiv: false

dataset:
  name: LightGenSLatEmission
  args:
    data_root: data/lightgen_test
    parquet_file: /localhome/dya78/code/lightgen/data/baked_uv_local_subset/df_SomgProc_emission_filtered.parquet
    resolution: 256
    split: null
    split_indices:
    - 0                      # single-sample overfit
    pbr_attrs:
    - base_color
    - metallic
    - roughness
    - alpha

trainer:
  name: EmissionVaeTrainer
  args:
    max_steps: 500
    batch_size_per_gpu: 1
    batch_split: 1
    optimizer:
      name: AdamW
      args:
        lr: 0.001
        weight_decay: 0.0
    loss_type: l1
    lambda_kl: 1.0e-07
    emission_channels: 3     # first 3 features of x are the reconstruction target
    i_log: 10
    i_sample: 100
    i_save: 500
    dataloader_num_workers: 0
    fp16_mode: null
    use_balanced_sampler: false
    num_sanity_val_steps: 0
    limit_val_batches: 0

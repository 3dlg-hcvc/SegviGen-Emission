# Overfit config: emission VAE with Option B conditioning (material latent concat)
#
# Architecture:
#   Emission encoder (trainable):   emission[3] → latent[32] at ~16³
#   PBR encoder (frozen, pretrained): PBR[6] → latent[32] at ~16³
#   Emission decoder (trainable):   concat[32+32=64] → emission[3]
#
# Both encoders have 4 downsample stages so latents share the same resolution.
# The decoder has pred_subdiv=false (follows spatial cache structure during training).
#
# Run:
#   conda run -n trellis2 python train.py \
#       --config configs/scvae/emission_vae_optionB_overfit.yaml \
#       --output_dir /tmp/emission_vae_optB_overfit --ckpt none

models:
  encoder:
    name: SparseUnetVaeEncoder
    args:
      in_channels: 3              # emission RGB only
      model_channels:
      - 32
      - 64
      - 128
      - 256
      - 512
      latent_channels: 32         # matches pretrained PBR encoder
      num_blocks:
      - 0
      - 2
      - 4
      - 8
      - 2
      block_type:
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      down_block_type:
      - SparseResBlockS2C3d
      - SparseResBlockS2C3d
      - SparseResBlockS2C3d
      - SparseResBlockS2C3d
      block_args:
      - use_checkpoint: false
      - use_checkpoint: false
      - use_checkpoint: false
      - use_checkpoint: false
      - use_checkpoint: false
      use_fp16: false
  decoder:
    name: SparseUnetVaeDecoder
    args:
      out_channels: 3             # reconstruct emission only
      model_channels:
      - 512
      - 256
      - 128
      - 64
      - 32
      latent_channels: 64         # 32 (emission) + 32 (material) concatenated
      num_blocks:
      - 2
      - 8
      - 4
      - 2
      - 0
      block_type:
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      - SparseConvNeXtBlock3d
      up_block_type:
      - SparseResBlockC2S3d
      - SparseResBlockC2S3d
      - SparseResBlockC2S3d
      - SparseResBlockC2S3d
      block_args:
      - use_checkpoint: false
      - use_checkpoint: false
      - use_checkpoint: false
      - use_checkpoint: false
      - use_checkpoint: false
      use_fp16: false
      pred_subdiv: false

dataset:
  name: LightGenSLatEmission
  args:
    data_root: data/lightgen_test
    parquet_file: /localhome/dya78/code/lightgen/data/baked_uv_local_subset/df_SomgProc_emission_filtered.parquet
    resolution: 256
    split: null
    split_indices:
    - 0                           # single-sample overfit
    pbr_attrs:
    - base_color
    - metallic
    - roughness
    - alpha

trainer:
  name: EmissionVaeTrainer
  args:
    max_steps: 1000
    batch_size_per_gpu: 1
    batch_split: 1
    optimizer:
      name: AdamW
      args:
        lr: 0.001
        weight_decay: 0.0
    loss_type: l1
    lambda_kl: 1.0e-07
    emission_channels: 3
    pretrained_pbr_encoder: microsoft/TRELLIS.2-4B/ckpts/tex_enc_next_dc_f16c32_fp16
    i_log: 10
    i_sample: 200
    i_save: 1000
    dataloader_num_workers: 0
    fp16_mode: null
    use_balanced_sampler: false
    num_sanity_val_steps: 0
    limit_val_batches: 0
